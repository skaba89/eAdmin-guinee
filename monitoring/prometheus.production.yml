global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: eadmin-guinee
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: eadmin-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
        labels:
          service: eadmin-backend

  - job_name: eadmin-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgresql

  - job_name: eadmin-redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis

  - job_name: eadmin-node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: infrastructure
