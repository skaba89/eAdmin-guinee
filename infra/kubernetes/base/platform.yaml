apiVersion: v1
kind: Namespace
metadata:
  name: eadmin-prod
  labels:
    app.kubernetes.io/part-of: eadmin-guinee
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eadmin-runtime-config
  namespace: eadmin-prod
data:
  ENVIRONMENT: production
  MFA_ISSUER: eAdmin Guinée
  MINIO_BUCKET_NAME: eadmin-documents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eadmin-backend
  namespace: eadmin-prod
  labels:
    app: eadmin-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: eadmin-backend
  template:
    metadata:
      labels:
        app: eadmin-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: eadmin-backend
      containers:
        - name: backend
          image: eadmin-backend:release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: eadmin-runtime-config
            - secretRef:
                name: eadmin-runtime-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: eadmin-backend
  namespace: eadmin-prod
spec:
  type: ClusterIP
  selector:
    app: eadmin-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eadmin-frontend
  namespace: eadmin-prod
  labels:
    app: eadmin-frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: eadmin-frontend
  template:
    metadata:
      labels:
        app: eadmin-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: eadmin-frontend
      containers:
        - name: frontend
          image: eadmin-frontend:release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eadmin-frontend
  namespace: eadmin-prod
spec:
  type: ClusterIP
  selector:
    app: eadmin-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eadmin-backend
  namespace: eadmin-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eadmin-backend
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eadmin-frontend
  namespace: eadmin-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eadmin-frontend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eadmin-backend
  namespace: eadmin-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: eadmin-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eadmin-frontend
  namespace: eadmin-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: eadmin-frontend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: eadmin-prod
spec:
  podSelector:
    matchLabels:
      app: eadmin-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: eadmin-frontend
        - namespaceSelector:
            matchLabels:
              eadmin.gov.gn/ingress-enabled: "true"
        - namespaceSelector:
            matchLabels:
              eadmin.gov.gn/monitoring-enabled: "true"
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  namespace: eadmin-prod
spec:
  podSelector:
    matchLabels:
      app: eadmin-frontend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              eadmin.gov.gn/ingress-enabled: "true"
      ports:
        - protocol: TCP
          port: 3000
