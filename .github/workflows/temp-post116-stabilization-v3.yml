name: Temporary Post-116 Stabilization V3

on:
  push:
    branches:
      - agent/post116-stabilization

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eadmin_iam
          POSTGRES_USER: eadmin
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadmin -d eadmin_iam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://eadmin:ci-test-password@localhost:5432/eadmin_iam
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_ENDPOINT: localhost:9000
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/post116-stabilization
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply deterministic V2 patch payload
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temp-post116-stabilization-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Static IAM governance gate"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('Unable to locate deterministic V2 patch payload')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          compile(payload, '<post116-patch>', 'exec')
          exec(payload, {'__name__': '__main__'})
          PY

      - name: Static IAM governance gate
        run: |
          python scripts/ops/check_iam_governance.py
          python scripts/ops/check_iam_abac_profile.py

      - name: Lint modified backend surface
        working-directory: backend
        run: |
          ruff check app/services/authorization_service.py app/api/users.py tests/test_iam_governance.py tests/test_service_catalog.py tests/test_service_request_hardening.py

      - name: Run targeted regression tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_iam_governance.py \
            tests/test_iam_abac_governance.py \
            tests/test_service_catalog.py \
            tests/test_service_request_hardening.py \
            tests/test_mairie_tenant_isolation.py \
            tests/test_municipality_routing_matrix.py \
            tests/test_municipality_service_request_routing.py

      - name: Run complete backend suite
        working-directory: backend
        run: pytest tests -q

      - name: Remove temporary artifacts and verify diff
        run: |
          rm .github/workflows/temp-post116-stabilization-v2.yml
          rm .github/workflows/temp-post116-stabilization-v3.yml
          rm -f .post116-trigger
          git diff --check
          git status --short

      - name: Commit validated stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize municipal routing governance"
          git push origin HEAD:agent/post116-stabilization
