name: Temporary SOC wiring

on:
  push:
    branches:
      - work/soc-siem-incident-response

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/soc-siem-incident-response
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire SOC configuration and routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Fail-closed SOC ingestion settings.
          replace_once(
              'backend/app/config.py',
              '    OIDC_AUTO_PROVISION: bool = False\n\n    CORS_ORIGINS_DEV: list[str] = [',
              '    OIDC_AUTO_PROVISION: bool = False\n\n'
              '    # Machine-to-machine security event ingestion. Disabled by default;\n'
              '    # secrets come from the deployment secret manager, never from Git.\n'
              '    SOC_INGEST_ENABLED: bool = False\n'
              '    SOC_INGEST_HMAC_SECRET: str = ""\n'
              '    SOC_INGEST_MAX_SKEW_SECONDS: int = 300\n\n'
              '    CORS_ORIGINS_DEV: list[str] = [',
          )
          replace_once(
              'backend/app/config.py',
              '        return self\n\n    @property\n    def is_development',
              '        if not 60 <= self.SOC_INGEST_MAX_SKEW_SECONDS <= 900:\n'
              '            raise ValueError("SOC_INGEST_MAX_SKEW_SECONDS must be between 60 and 900 seconds.")\n'
              '        if self.SOC_INGEST_ENABLED and len(self.SOC_INGEST_HMAC_SECRET) < 32:\n'
              '            raise ValueError(\n'
              '                "SOC ingestion is enabled but SOC_INGEST_HMAC_SECRET is shorter than 32 characters."\n'
              '            )\n\n'
              '        return self\n\n    @property\n    def is_development',
          )

          # 2) Register machine ingestion outside user RLS, human SOC endpoints under RLS.
          replace_once(
              'backend/app/main.py',
              '    security_events,\n    security_hardening,\n',
              '    security_events,\n    security_hardening,\n    soc,\n',
          )
          replace_once(
              'backend/app/main.py',
              'app.include_router(\n    identity_federation.public_router,\n    prefix="/api/v1/auth/sso",\n    tags=["SSO OIDC"],\n)\n# Authentication and security overrides are intentionally registered first.',
              'app.include_router(\n    identity_federation.public_router,\n    prefix="/api/v1/auth/sso",\n    tags=["SSO OIDC"],\n)\n'
              'app.include_router(\n'
              '    soc.ingest_router,\n'
              '    prefix="/api/v1/soc",\n'
              '    tags=["SOC - ingestion machine"],\n'
              ')\n'
              '# Authentication and security overrides are intentionally registered first.',
          )
          replace_once(
              'backend/app/main.py',
              'app.include_router(\n    security_events.router,\n    prefix="/api/v1/security-events",\n    tags=["Événements de Sécurité"],\n    dependencies=rls_dependencies,\n)\napp.include_router(metrics.router, tags=["Métriques"])',
              'app.include_router(\n    security_events.router,\n    prefix="/api/v1/security-events",\n    tags=["Événements de Sécurité"],\n    dependencies=rls_dependencies,\n)\n'
              'app.include_router(\n'
              '    soc.router,\n'
              '    prefix="/api/v1/soc",\n'
              '    tags=["SOC et réponse à incident"],\n'
              '    dependencies=rls_dependencies,\n'
              ')\n'
              'app.include_router(metrics.router, tags=["Métriques"])',
          )

          # 3) SQLite test path: production still requires the SOC_SERVICE RLS context.
          signal_values = '''SecuritySignal.__table__.insert().values(
                  id=uuid.uuid4(),
                  source="application_audit",
                  external_event_id=f"audit:{target_id}",
                  event_type=event_type[:150],
                  category=(category or "audit")[:100],
                  severity=severity,
                  tenant_id=tenant_id[:100],
                  institution_id=str(institution_id)[:100] if institution_id else None,
                  actor_id=actor_id,
                  resource_type=str(resource_type)[:100] if resource_type else None,
                  resource_id=str(resource_id)[:255] if resource_id else None,
                  correlation_key=correlation_key,
                  network_source_hash=network_hash,
                  user_agent_hash=agent_hash,
                  details=normalized_details,
                  occurred_at=occurred_at,
              )'''
          replace_once(
              'backend/app/services/soc_service.py',
              '    original = connection.execute(\n',
              '    if connection.dialect.name != "postgresql":\n'
              '        connection.execute(\n'
              f'            {signal_values}\n'
              '        )\n'
              '        return\n\n'
              '    original = connection.execute(\n',
          )

          # 4) Keep the adversarial test explicit.
          replace_once(
              'backend/tests/test_soc_service.py',
              '        severity="warning" if False else "high",',
              '        severity="high",',
          )

          # 5) Remove this temporary helper before the branch can ever merge.
          Path('.github/workflows/temp-soc-wire.yml').unlink()
          PY

          git diff --check
          git status --short

      - name: Commit and push final wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "wire(soc): register SOC routes and fail-closed ingestion"
          git push origin HEAD:work/soc-siem-incident-response
