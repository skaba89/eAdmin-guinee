name: Temporary Grounded AI Municipality Scope

on:
  push:
    branches:
      - scratch/grounded-ai-municipality-scope

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eadmin_ai_scope
          POSTGRES_USER: eadmin
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadmin -d eadmin_ai_scope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://eadmin:ci-test-password@localhost:5432/eadmin_ai_scope
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_ENDPOINT: localhost:9000
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v4
        with:
          ref: scratch/grounded-ai-municipality-scope
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply deterministic AI scope patch
        run: python .scratch/grounded_ai_municipality_patch.py

      - name: Lint AI scope surface
        working-directory: backend
        run: |
          ruff check \
            app/api/ai_grounded.py \
            app/services/grounded_ai_service.py \
            tests/test_grounded_ai_municipality_scope.py

      - name: Run focused AI and municipality regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_grounded_ai_municipality_scope.py \
            tests/test_grounded_ai_hardening.py \
            tests/test_public_municipality_catalog_scope.py \
            tests/test_service_catalog.py \
            tests/test_municipality_routing_matrix.py \
            tests/test_municipality_service_request_routing.py

      - name: Run complete backend suite
        working-directory: backend
        run: pytest tests -q

      - name: Verify product-only diff
        run: |
          git diff --check
          git status --short
          test -f backend/tests/test_grounded_ai_municipality_scope.py

      - name: Commit only validated AI product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/api/ai_grounded.py \
            backend/app/services/grounded_ai_service.py \
            backend/tests/test_grounded_ai_municipality_scope.py
          git diff --cached --check
          git commit -m "fix(ai): scope grounded services by municipality assignment"
          git push origin HEAD:scratch/grounded-ai-municipality-scope
