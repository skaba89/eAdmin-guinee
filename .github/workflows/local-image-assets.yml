name: Local Image Assets Gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'next.config.ts'
      - 'scripts/check-local-images.mjs'
      - '.github/workflows/local-image-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify all runtime images are local
        run: node scripts/check-local-images.mjs
