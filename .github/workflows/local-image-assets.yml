name: Local Image Assets Gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'next.config.ts'
      - 'scripts/check-local-images.mjs'
      - '.github/workflows/local-image-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify all runtime images are local
        run: node scripts/check-local-images.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone frontend
        run: bun run build

      - name: Assemble standalone public assets
        run: |
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start standalone server
        run: |
          cd .next/standalone
          PORT=3100 HOSTNAME=127.0.0.1 node server.js > /tmp/eadmin-local-images.log 2>&1 &
          echo $! > /tmp/eadmin-local-images.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eadmin-local-images.log
          exit 1

      - name: Smoke-test local image HTTP responses
        run: |
          set -euo pipefail

          check_asset() {
            local path="$1"
            local expected_type="$2"
            local expected_magic="$3"
            local headers
            local body
            headers="$(mktemp)"
            body="$(mktemp)"

            curl -fsS -D "$headers" -o "$body" "http://127.0.0.1:3100${path}"
            grep -Eiq "^content-type: ${expected_type}([;[:space:]]|$)" "$headers" || {
              echo "Unexpected Content-Type for ${path}"
              cat "$headers"
              exit 1
            }

            python3 - "$body" "$expected_magic" <<'PY'
import pathlib
import sys

body = pathlib.Path(sys.argv[1]).read_bytes()
kind = sys.argv[2]
if kind == "jpeg":
    ok = body.startswith(b"\xff\xd8\xff")
elif kind == "png":
    ok = body.startswith(b"\x89PNG\r\n\x1a\n")
else:
    raise SystemExit(f"Unsupported expected magic: {kind}")
if not ok:
    raise SystemExit(f"Invalid {kind} signature for {sys.argv[1]}")
PY
            echo "OK ${path} -> ${expected_type}"
          }

          check_asset /guinea-hero-conakry.png image/jpeg jpeg
          check_asset /guinea-mosque-conakry.png image/jpeg jpeg
          check_asset /guinea-fouta-djallon.png image/jpeg jpeg
          check_asset /guinea-nimba-mountains.png image/jpeg jpeg
          check_asset /guinea-niger-river.png image/jpeg jpeg
          check_asset /guinea-culture-dance.png image/jpeg jpeg
          check_asset /guinea-hero-conakry.jpg image/jpeg jpeg
          check_asset /logo-128.png image/png png
          check_asset /favicon-32x32.png image/png png

      - name: Stop standalone server
        if: always()
        run: |
          if [ -f /tmp/eadmin-local-images.pid ]; then
            kill "$(cat /tmp/eadmin-local-images.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/eadmin-local-images.log ]; then
            tail -n 100 /tmp/eadmin-local-images.log || true
          fi
