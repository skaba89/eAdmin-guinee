name: Temporary Bun Lockfile Refresh

on:
  push:
    branches:
      - agent/p0-ci-gates-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Regenerate Bun lockfile
        run: bun install

      - name: Verify dependency tree installs
        run: bun install --frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-bun-lock
          path: bun.lock
          if-no-files-found: error
