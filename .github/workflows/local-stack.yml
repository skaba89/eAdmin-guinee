name: Local Stack Gate

on:
  pull_request:
    paths:
      - 'Dockerfile.local'
      - 'docker-compose.local.yml'
      - 'package.json'
      - 'bun.lock'
      - 'backend/**'
      - 'src/lib/api-base-url.ts'
      - 'src/lib/users-api.ts'
      - 'src/lib/institutions-api.ts'
      - 'src/components/app/managed-users-page.tsx'
      - 'scripts/local.ps1'
      - 'local-*.bat'
      - 'docs/LOCAL_DEVELOPMENT.md'
      - '.github/workflows/local-stack.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.local'
      - 'docker-compose.local.yml'
      - 'package.json'
      - 'bun.lock'
      - 'backend/**'
      - 'src/lib/api-base-url.ts'
      - 'src/lib/users-api.ts'
      - 'src/lib/institutions-api.ts'
      - 'src/components/app/managed-users-page.tsx'
      - 'scripts/local.ps1'
      - 'local-*.bat'
      - '.github/workflows/local-stack.yml'

permissions:
  contents: read

jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated local CI environment
        run: |
          cat > .env.local.ci <<'EOF'
          POSTGRES_PASSWORD=ci_postgres_password_2026
          REDIS_PASSWORD=ci_redis_password_2026
          MINIO_ROOT_USER=eadmin
          MINIO_ROOT_PASSWORD=ci_minio_password_2026
          SECRET_KEY=ci_secret_key_0123456789abcdef0123456789abcdef0123456789abcdef
          ENCRYPTION_KEY=ci_encryption_key_0123456789abcdef0123456789abcdef
          NEXT_PUBLIC_ENCRYPTION_KEY=ci_frontend_encryption_0123456789abcdef
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=Grafana!2026Aa-ci-password
          LOCAL_TEST_PASSWORD=CiLocal!2026Aa-test-password
          LOCAL_TEST_DOMAIN=eadmin.test
          LOCAL_SUPERADMIN_EMAIL=superadmin@eadmin.test
          LOCAL_FRONTEND_PORT=3000
          LOCAL_BACKEND_PORT=8000
          LOCAL_POSTGRES_PORT=5433
          LOCAL_REDIS_PORT=6380
          LOCAL_MINIO_API_PORT=9000
          LOCAL_MINIO_CONSOLE_PORT=9001
          LOCAL_MAILPIT_SMTP_PORT=1025
          LOCAL_MAILPIT_UI_PORT=8025
          LOCAL_PROMETHEUS_PORT=9090
          LOCAL_GRAFANA_PORT=3001
          EOF

      - name: Validate Compose model
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml config > /tmp/eadmin-local-compose.yml
          grep -q 'eadmin-local-backend' /tmp/eadmin-local-compose.yml
          grep -q 'eadmin-local-frontend' /tmp/eadmin-local-compose.yml

      - name: Build local backend and frontend images
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml build backend frontend notification-worker

      - name: Verify localhost browser API resolver
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml run --rm --no-deps \
            -e NODE_ENV=production -e NEXT_PUBLIC_API_URL= frontend \
            bun -e "globalThis.window={location:{hostname:'localhost'}}; const m=await import('./src/lib/api-base-url.ts'); if(m.API_URL!=='http://localhost:8000'){throw new Error('unexpected API URL: '+m.API_URL)}; console.log('browser API URL OK',m.API_URL)"

      - name: Start local infrastructure
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml up -d postgres redis minio minio-init mailpit
          docker compose --env-file .env.local.ci -f docker-compose.local.yml ps

      - name: Validate backend settings
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml run --rm --no-deps backend \
            python -c "from app.config import settings; print('settings OK', settings.ENVIRONMENT, settings.DATABASE_URL.split('@')[-1])"

      - name: Run migrations explicitly
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml run --rm --no-deps backend alembic upgrade head

      - name: Run enabled bootstrap explicitly
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml run --rm --no-deps backend python -m app.bootstrap_runtime

      - name: Verify users directly in PostgreSQL
        run: |
          set -euo pipefail
          docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
            psql -U eadmin -d eadmin -P pager=off -c \
            "SELECT email, role, is_active, security_clearance, assurance_level, privileged_account FROM users ORDER BY role, email;"

          USER_COUNT="$(docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
            psql -U eadmin -d eadmin -Atc "SELECT count(*) FROM users;")"
          test "${USER_COUNT}" -ge 9

          for email in \
            superadmin@eadmin.test citoyen@eadmin.test agent@eadmin.test mairie@eadmin.test \
            agence@eadmin.test admin@eadmin.test chef-service@eadmin.test directeur@eadmin.test ministre@eadmin.test
          do
            FOUND="$(docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
              psql -U eadmin -d eadmin -Atc "SELECT count(*) FROM users WHERE email='${email}' AND is_active=TRUE;")"
            test "${FOUND}" = "1"
          done

      - name: Import FastAPI application explicitly
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml run --rm --no-deps backend \
            python -c "from app.main import app; print('FastAPI import OK', app.title)"

      - name: Start backend service
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml up -d backend

      - name: Wait for backend health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health >/tmp/backend-health.json; then
              cat /tmp/backend-health.json
              exit 0
            fi
            if ! docker compose --env-file .env.local.ci -f docker-compose.local.yml ps --status running backend | grep -q eadmin-local-backend; then
              echo 'Backend container stopped before becoming healthy.' >&2
              docker compose --env-file .env.local.ci -f docker-compose.local.yml ps -a backend
              docker compose --env-file .env.local.ci -f docker-compose.local.yml logs --tail 250 backend
              exit 1
            fi
            sleep 2
          done
          docker compose --env-file .env.local.ci -f docker-compose.local.yml logs --tail 250 backend
          exit 1

      - name: Verify bootstrapped portal accounts through auth API
        run: |
          set -euo pipefail
          login() {
            local email="$1"
            local output_file="$2"
            local status_code
            status_code="$(curl -sS -o "${output_file}" -w '%{http_code}' -X POST http://localhost:8000/api/v1/auth/login \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "username=${email}" \
              --data-urlencode 'password=CiLocal!2026Aa-test-password')"
            echo "Login ${email}: HTTP ${status_code}"
            cat "${output_file}"
            echo
            if [ "${status_code}" != "200" ]; then
              echo "Authentication failed for ${email}" >&2
              docker compose --env-file .env.local.ci -f docker-compose.local.yml logs --tail 200 backend
              return 1
            fi
          }

          login superadmin@eadmin.test /tmp/superadmin-login.json
          login citoyen@eadmin.test /tmp/citizen-login.json

          SUPERADMIN_TOKEN="$(python - <<'PY'
          import json
          with open('/tmp/superadmin-login.json', encoding='utf-8') as handle:
              print(json.load(handle)['access_token'])
          PY
          )"

          USERS_STATUS="$(curl -sS -o /tmp/users.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPERADMIN_TOKEN}" \
            'http://localhost:8000/api/v1/users?page=1&page_size=100')"
          echo "GET /api/v1/users: HTTP ${USERS_STATUS}"
          cat /tmp/users.json
          echo
          test "${USERS_STATUS}" = "200"

          python - <<'PY'
          import json
          with open('/tmp/users.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          emails = {item['email'] for item in payload['items']}
          required = {
              'citoyen@eadmin.test',
              'agent@eadmin.test',
              'mairie@eadmin.test',
              'agence@eadmin.test',
              'admin@eadmin.test',
              'chef-service@eadmin.test',
              'directeur@eadmin.test',
              'ministre@eadmin.test',
          }
          missing = required - emails
          assert not missing, f'Missing local portal accounts: {sorted(missing)}'
          assert payload['total'] >= 9, payload
          PY

      - name: Verify durable mairie admins and cross-mairie dossier isolation
        run: |
          set -euo pipefail

          docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
            psql -U eadmin -d eadmin -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO institutions (id, tenant_id, name, type, is_active, settings)
          VALUES
            ('mairie-ratoma-ci', 'republique-de-guinee', 'Mairie de Ratoma CI', 'mairie', TRUE, '{"ci": true}'::json),
            ('mairie-matoto-ci', 'republique-de-guinee', 'Mairie de Matoto CI', 'mairie', TRUE, '{"ci": true}'::json)
          ON CONFLICT (id) DO UPDATE SET
            tenant_id = EXCLUDED.tenant_id,
            name = EXCLUDED.name,
            type = EXCLUDED.type,
            is_active = TRUE;
          SQL

          login_token() {
            local email="$1"
            curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "username=${email}" \
              --data-urlencode 'password=CiLocal!2026Aa-test-password' \
              | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])"
          }

          SUPERADMIN_TOKEN="$(login_token superadmin@eadmin.test)"

          create_admin() {
            local email="$1"
            local name="$2"
            local institution="$3"
            local output="$4"
            curl -sS -o "${output}" -w '%{http_code}' -X POST http://localhost:8000/api/v1/users \
              -H "Authorization: Bearer ${SUPERADMIN_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"${email}\",\"password\":\"CiMairie!2026Aa-test-password\",\"full_name\":\"${name}\",\"role\":\"ADMIN\",\"tenant_id\":\"republique-de-guinee\",\"institution_id\":\"${institution}\"}"
          }

          RATOMA_STATUS="$(create_admin admin.ratoma@example.com 'Admin Ratoma CI' mairie-ratoma-ci /tmp/admin-ratoma.json)"
          MATOTO_STATUS="$(create_admin admin.matoto@example.com 'Admin Matoto CI' mairie-matoto-ci /tmp/admin-matoto.json)"
          echo "Create Ratoma ADMIN: HTTP ${RATOMA_STATUS}"; cat /tmp/admin-ratoma.json; echo
          echo "Create Matoto ADMIN: HTTP ${MATOTO_STATUS}"; cat /tmp/admin-matoto.json; echo
          test "${RATOMA_STATUS}" = "201"
          test "${MATOTO_STATUS}" = "201"

          # The API response is not enough: prove both rows are already durable
          # in PostgreSQL before any subsequent request or container shutdown.
          for email in admin.ratoma@example.com admin.matoto@example.com; do
            FOUND="$(docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
              psql -U eadmin -d eadmin -Atc "SELECT count(*) FROM users WHERE email='${email}' AND is_active=TRUE;")"
            test "${FOUND}" = "1"
          done

          DUPLICATE_STATUS="$(create_admin admin.ratoma2@example.com 'Second Admin Ratoma CI' mairie-ratoma-ci /tmp/admin-ratoma-duplicate.json)"
          echo "Second Ratoma ADMIN: HTTP ${DUPLICATE_STATUS}"; cat /tmp/admin-ratoma-duplicate.json; echo
          test "${DUPLICATE_STATUS}" = "409"

          # Seed one dossier per municipality using the ORM so enum/UUID types
          # match the production model exactly.
          docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T backend python - <<'PY'
          import asyncio
          import uuid
          from datetime import datetime, timedelta, timezone
          from sqlalchemy import select
          from app.database import async_session_factory
          from app.models.service_request import DeliveryModeEnum, ServiceRequest, ServiceRequestStatusEnum
          from app.models.user import User

          async def main():
              async with async_session_factory() as session:
                  citizen = await session.scalar(select(User).where(User.email == 'citoyen@eadmin.test'))
                  assert citizen is not None
                  rows = (
                      ('11111111-1111-4111-8111-111111111111', 'CI-RATOMA-001', 'mairie-ratoma-ci'),
                      ('22222222-2222-4222-8222-222222222222', 'CI-MATOTO-001', 'mairie-matoto-ci'),
                  )
                  for request_id, reference, institution_id in rows:
                      existing = await session.get(ServiceRequest, uuid.UUID(request_id))
                      if existing:
                          continue
                      session.add(ServiceRequest(
                          id=uuid.UUID(request_id),
                          reference=reference,
                          service_id='ci-service',
                          service_name='Service CI',
                          category='CI',
                          category_id='ci',
                          citizen_id=citizen.id,
                          citizen_name='Citoyen',
                          citizen_first_name='Test',
                          citizen_nin='CI-NIN-001',
                          citizen_phone='+224000000000',
                          citizen_email=citizen.email,
                          citizen_address='Conakry',
                          motif='Test isolation mairie',
                          required_documents=[],
                          status=ServiceRequestStatusEnum.SOUMISE,
                          assigned_service=institution_id,
                          timeline=[],
                          deadline_days=5,
                          deadline_date=datetime.now(timezone.utc) + timedelta(days=5),
                          delivery_mode=DeliveryModeEnum.EN_LIGNE,
                          tenant_id='republique-de-guinee',
                          institution_id=institution_id,
                      ))
                  await session.commit()
          asyncio.run(main())
          PY

          RATOMA_TOKEN="$(curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=admin.ratoma@example.com' \
            --data-urlencode 'password=CiMairie!2026Aa-test-password' \
            | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")"

          RATOMA_LIST_STATUS="$(curl -sS -o /tmp/ratoma-requests.json -w '%{http_code}' \
            -H "Authorization: Bearer ${RATOMA_TOKEN}" \
            'http://localhost:8000/api/v1/service-requests?page=1&page_size=100')"
          echo "Ratoma dossier list: HTTP ${RATOMA_LIST_STATUS}"; cat /tmp/ratoma-requests.json; echo
          test "${RATOMA_LIST_STATUS}" = "200"
          python - <<'PY'
          import json
          with open('/tmp/ratoma-requests.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          refs = {item['reference'] for item in payload['items']}
          assert 'CI-RATOMA-001' in refs, refs
          assert 'CI-MATOTO-001' not in refs, refs
          assert all(item['institutionId'] == 'mairie-ratoma-ci' for item in payload['items']), payload
          PY

          CROSS_STATUS="$(curl -sS -o /tmp/cross-mairie.json -w '%{http_code}' \
            -H "Authorization: Bearer ${RATOMA_TOKEN}" \
            'http://localhost:8000/api/v1/service-requests/22222222-2222-4222-8222-222222222222')"
          echo "Ratoma reads Matoto dossier: HTTP ${CROSS_STATUS}"; cat /tmp/cross-mairie.json; echo
          test "${CROSS_STATUS}" = "404"

      - name: Start and verify frontend and notification worker
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml up -d frontend notification-worker
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3000 >/tmp/frontend.html; then
              test -s /tmp/frontend.html
              docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T frontend \
                sh -lc 'test "$NEXT_PUBLIC_API_URL" = "http://localhost:8000" && echo "frontend env OK: $NEXT_PUBLIC_API_URL"'
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.local.ci -f docker-compose.local.yml logs --tail 200 frontend
          exit 1

      - name: Show local service state
        if: always()
        run: docker compose --env-file .env.local.ci -f docker-compose.local.yml ps -a || true

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.local.ci -f docker-compose.local.yml logs --tail 250 || true

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.local.ci -f docker-compose.local.yml down -v --remove-orphans || true