name: Temporary Post-116 Stabilization

on:
  push:
    branches:
      - agent/post116-stabilization

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/post116-stabilization
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply deterministic post-116 patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'backend/app/services/authorization_service.py',
              '''    @staticmethod
              def can_administer_user(actor: User, target: User) -> bool:
                  """Permanent user administration never inherits through a temporary grant."""
                  if actor.role == RoleEnum.SUPER_ADMIN:
                      return actor.id != target.id
                  if not actor.is_active or actor.id == target.id:
                      return False
                  if actor.role.hierarchy_level() <= target.role.hierarchy_level():
                      return False
                  if (actor.tenant_id or "") != (target.tenant_id or ""):
                      return False
                  if actor.role == RoleEnum.MINISTRE:
                      return True
                  return bool(actor.institution_id) and actor.institution_id == target.institution_id
          ''',
              '''    @staticmethod
              def can_administer_user(
                  actor: User,
                  target: User,
                  *,
                  institution_scope_verified: bool = False,
              ) -> bool:
                  """Authorize permanent user administration from trusted server scope only.

                  ``institution_scope_verified`` may only represent a server-side hierarchy proof
                  (for example a mairie root administering an active descendant service). It never
                  bypasses self-administration, role hierarchy, activity, or tenant isolation.
                  """
                  if actor.role == RoleEnum.SUPER_ADMIN:
                      return actor.id != target.id
                  if not actor.is_active or actor.id == target.id:
                      return False
                  if actor.role.hierarchy_level() <= target.role.hierarchy_level():
                      return False
                  if (actor.tenant_id or "") != (target.tenant_id or ""):
                      return False
                  if actor.role == RoleEnum.MINISTRE:
                      return True
                  if institution_scope_verified:
                      return bool(actor.institution_id) and bool(target.institution_id)
                  return bool(actor.institution_id) and actor.institution_id == target.institution_id
          ''',
          )

          replace_once(
              'backend/app/api/users.py',
              '''    )
              db.add(user)
              await db.flush()
              await identity_lifecycle_service.record_joiner(
          ''',
              '''    )
              institution_scope_verified = await _institution_in_actor_scope(
                  db, current_user, user.institution_id
              )
              if not authorization_service.can_administer_user(
                  current_user,
                  user,
                  institution_scope_verified=institution_scope_verified,
              ):
                  raise HTTPException(
                      status_code=403,
                      detail="Création du compte hors de votre périmètre administratif.",
                  )
              db.add(user)
              await db.flush()
              await identity_lifecycle_service.record_joiner(
          ''',
          )

          replace_once(
              'backend/app/api/users.py',
              '''    if not await _can_view_user_governed(db, current_user, user):
                  raise HTTPException(
                      status_code=403,
                      detail="Compte hors de votre niveau ou périmètre administratif.",
                  )

              update_data = user_data.model_dump(exclude_unset=True)
          ''',
              '''    if not await _can_view_user_governed(db, current_user, user):
                  raise HTTPException(
                      status_code=403,
                      detail="Compte hors de votre niveau ou périmètre administratif.",
                  )
              institution_scope_verified = await _institution_in_actor_scope(
                  db, current_user, user.institution_id
              )
              if not authorization_service.can_administer_user(
                  current_user,
                  user,
                  institution_scope_verified=institution_scope_verified,
              ):
                  raise HTTPException(
                      status_code=403,
                      detail="Mutation utilisateur hors de votre périmètre administratif.",
                  )

              update_data = user_data.model_dump(exclude_unset=True)
          ''',
          )

          replace_once(
              'backend/app/api/users.py',
              '''    if not await _can_view_user_governed(db, current_user, user):
                  raise HTTPException(status_code=403, detail="Désactivation hors périmètre interdite.")

              await identity_lifecycle_service.offboard_user(
          ''',
              '''    if not await _can_view_user_governed(db, current_user, user):
                  raise HTTPException(status_code=403, detail="Désactivation hors périmètre interdite.")
              institution_scope_verified = await _institution_in_actor_scope(
                  db, current_user, user.institution_id
              )
              if not authorization_service.can_administer_user(
                  current_user,
                  user,
                  institution_scope_verified=institution_scope_verified,
              ):
                  raise HTTPException(status_code=403, detail="Désactivation hors périmètre interdite.")

              await identity_lifecycle_service.offboard_user(
          ''',
          )

          replace_once(
              'backend/tests/test_service_catalog.py',
              '''from app.models.administrative_service import AdministrativeService
              from app.models.service_request import ServiceRequest
          ''',
              '''from app.models.administrative_service import AdministrativeService
              from app.models.institution import Institution
              from app.models.institution_service_assignment import InstitutionServiceAssignment
              from app.models.service_request import ServiceRequest
          ''',
          )

          replace_once(
              'backend/tests/test_service_catalog.py',
              '''    citoyen_user.tenant_id = test_tenant.id
              authoritative = catalog_row(
          ''',
              '''    citoyen_user.tenant_id = test_tenant.id
              test_institution.type = "mairie"
              test_institution.name = "Mairie Test"
              processing_service = Institution(
                  id="test-institution-service",
                  tenant_id=test_tenant.id,
                  name="Service interne Test",
                  type="service",
                  parent_id=test_institution.id,
                  code="TEST-SVC-001",
                  is_active=True,
              )
              db_session.add(processing_service)
              authoritative = catalog_row(
          ''',
          )

          replace_once(
              'backend/tests/test_service_catalog.py',
              '''    db_session.add(authoritative)
              await db_session.flush()

              payload = ServiceRequestCreate(
          ''',
              '''    db_session.add(authoritative)
              await db_session.flush()
              db_session.add(
                  InstitutionServiceAssignment(
                      tenant_id=test_tenant.id,
                      institution_id=test_institution.id,
                      service_id=authoritative.service_id,
                      service_institution_id=processing_service.id,
                      is_active=True,
                  )
              )
              await db_session.flush()

              payload = ServiceRequestCreate(
          ''',
          )

          replace_once(
              'backend/tests/test_service_request_hardening.py',
              '''    institution = SimpleNamespace(id="institution-a", name="Mairie A")
              db_result = MagicMock()
          ''',
              '''    institution = SimpleNamespace(id="institution-a", name="Mairie A", type="mairie")
              assignment = SimpleNamespace(service_institution_id="service-a")
              processing_service = SimpleNamespace(id="service-a", name="Service A", type="service")
              db_result = MagicMock()
          ''',
          )

          replace_once(
              'backend/tests/test_service_request_hardening.py',
              '''    db = MagicMock()
              db.execute = AsyncMock(return_value=db_result)
              db.add = MagicMock()
          ''',
              '''    db = MagicMock()
              db.execute = AsyncMock(return_value=db_result)
              db.scalar = AsyncMock(return_value=processing_service)
              db.add = MagicMock()
          ''',
          )

          replace_once(
              'backend/tests/test_service_request_hardening.py',
              '''    monkeypatch.setattr(
                  "app.api.service_requests.get_active_service",
                  AsyncMock(return_value=catalog_service),
              )
              append_note = AsyncMock()
          ''',
              '''    monkeypatch.setattr(
                  "app.api.service_requests.get_active_service",
                  AsyncMock(return_value=catalog_service),
              )
              monkeypatch.setattr(
                  "app.api.service_requests.get_active_service_assignment",
                  AsyncMock(return_value=assignment),
              )
              append_note = AsyncMock()
          ''',
          )

          marker = '''@pytest.mark.asyncio
          async def test_temporary_grant_requires_mfa_and_cannot_escape_tenant(db_session):
          '''
          iam_path = Path('backend/tests/test_iam_governance.py')
          iam_text = iam_path.read_text(encoding='utf-8')
          if iam_text.count(marker) != 1:
              raise SystemExit('backend/tests/test_iam_governance.py: insertion marker mismatch')
          new_test = '''@pytest.mark.asyncio
          async def test_central_user_admin_guard_preserves_descendant_scope_boundaries(db_session):
              actor = await _user(
                  db_session,
                  email="admin.descendant.guard@eadmin.gn",
                  role=RoleEnum.ADMIN,
                  tenant_id=settings.TENANT_DEFAULT_ID,
                  institution_id="mairie-root",
              )
              target = await _user(
                  db_session,
                  email="agent.descendant.guard@eadmin.gn",
                  role=RoleEnum.AGENT,
                  tenant_id=settings.TENANT_DEFAULT_ID,
                  institution_id="mairie-root-service",
              )

              assert authorization_service.can_administer_user(actor, target) is False
              assert authorization_service.can_administer_user(
                  actor,
                  target,
                  institution_scope_verified=True,
              ) is True

              target.tenant_id = "other-tenant"
              assert authorization_service.can_administer_user(
                  actor,
                  target,
                  institution_scope_verified=True,
              ) is False

              target.tenant_id = settings.TENANT_DEFAULT_ID
              target.role = RoleEnum.DIRECTEUR
              assert authorization_service.can_administer_user(
                  actor,
                  target,
                  institution_scope_verified=True,
              ) is False


          '''
          iam_path.write_text(iam_text.replace(marker, new_test + marker, 1), encoding='utf-8')
          PY

      - name: Static IAM governance gate
        run: python scripts/ops/check_iam_governance.py

      - name: Lint modified backend surface
        working-directory: backend
        run: |
          ruff check app/services/authorization_service.py app/api/users.py tests/test_iam_governance.py tests/test_service_catalog.py tests/test_service_request_hardening.py

      - name: Run targeted regression tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_iam_governance.py \
            tests/test_service_catalog.py \
            tests/test_service_request_hardening.py \
            tests/test_mairie_tenant_isolation.py \
            tests/test_municipality_routing_matrix.py \
            tests/test_municipality_service_request_routing.py

      - name: Run complete backend suite
        working-directory: backend
        run: pytest tests -q

      - name: Remove temporary workflow and verify diff
        run: |
          rm .github/workflows/temp-post116-stabilization.yml
          git diff --check
          git status --short

      - name: Commit validated stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/authorization_service.py \
                  backend/app/api/users.py \
                  backend/tests/test_iam_governance.py \
                  backend/tests/test_service_catalog.py \
                  backend/tests/test_service_request_hardening.py \
                  .github/workflows/temp-post116-stabilization.yml
          git commit -m "fix: stabilize municipal routing governance"
          git push origin HEAD:agent/post116-stabilization
