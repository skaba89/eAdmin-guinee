name: Temporary Remove Client Policy Logic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-client-sla-policy

      - name: Remove remaining client-side SLA authority
        shell: python
        run: |
          from pathlib import Path

          store = Path('src/store/citizen-requests-store.ts')
          text = store.read_text(encoding='utf-8')

          marker = '  categoryId: string\n'
          snapshot = '''  categoryId: string\n  serviceCatalogVersion?: number | null\n  servicePolicyStatus?: string | null\n  servicePolicySource?: string | null\n  serviceFeeLabel?: string | null\n  expectedProcessingLabel?: string | null\n'''
          if 'serviceCatalogVersion?: number | null' not in text:
              if marker not in text:
                  raise SystemExit('CitizenRequest category marker missing')
              text = text.replace(marker, snapshot, 1)

          fn_start = 'export function getDeadlineDays(categoryId: string): number {\n'
          if fn_start in text:
              start = text.index(fn_start)
              end = text.index('\n}\n', start) + 3
              text = text[:start] + text[end:]

          for payload_line in [
              '      serviceName: req.serviceName,\n',
              '      category: req.category,\n',
              '      categoryId: req.categoryId,\n',
              '      documents: req.documents,\n',
          ]:
              text = text.replace(payload_line, '', 1)
          store.write_text(text, encoding='utf-8')

          portal = Path('src/components/app/citizen-portal-page.tsx')
          text = portal.read_text(encoding='utf-8')
          text = text.replace(' getDeadlineDays,', '', 1)
          text = text.replace('getDeadlineDays, ', '', 1)
          text = text.replace('getDeadlineDays,', '', 1)
          legacy = '''  // Calculate estimated delivery date based on legal deadline\n  const getServiceSLA = (categoryId: string): number => {\n    return getDeadlineDays(categoryId)\n  }\n\n'''
          text = text.replace(legacy, '', 1)
          portal.write_text(text, encoding='utf-8')

      - name: Commit cleanup
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- src/store/citizen-requests-store.ts src/components/app/citizen-portal-page.tsx; then
            echo 'No cleanup changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/store/citizen-requests-store.ts src/components/app/citizen-portal-page.tsx
          git commit -m 'refactor(citizen): remove remaining client-side SLA policy'
          git push origin HEAD:agent/remove-client-sla-policy
