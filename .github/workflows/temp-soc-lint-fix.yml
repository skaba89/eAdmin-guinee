name: Temporary SOC lint cleanup

on:
  push:
    branches:
      - work/soc-siem-incident-response

permissions:
  contents: write

concurrency:
  group: temporary-soc-lint-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/soc-siem-incident-response
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply strict exception cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/api/soc.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import json\n', '')
          if 'from pydantic import BaseModel, Field, ValidationError' not in text:
              text = text.replace(
                  'from pydantic import BaseModel, Field\n',
                  'from pydantic import BaseModel, Field, ValidationError\n',
                  1,
              )
          text = text.replace(
              '    except Exception as exc:\n        raise HTTPException(status_code=422, detail="Signal SOC invalide.") from exc\n',
              '    except ValidationError as exc:\n        raise HTTPException(status_code=422, detail="Signal SOC invalide.") from exc\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          for helper in (
              '.github/workflows/temp-soc-wire.yml',
              '.github/workflows/temp-soc-finalize-wiring.yml',
              '.github/workflows/temp-soc-lint-fix.yml',
          ):
              p = Path(helper)
              if p.exists():
                  p.unlink()
          PY
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes required"
            exit 0
          fi
          git commit -m "fix(soc): narrow ingest validation errors and remove helper workflows"
          git push origin HEAD:work/soc-siem-incident-response
