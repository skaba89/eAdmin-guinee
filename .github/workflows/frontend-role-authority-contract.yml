name: Frontend Role Authority Contract

on:
  pull_request:
    paths:
      - 'src/lib/frontend-role-authority.ts'
      - 'src/lib/service-request-rbac.ts'
      - 'src/lib/service-request-scope.ts'
      - 'backend/app/models/user.py'
      - 'scripts/check-frontend-role-authority-contract.ts'
      - '.github/workflows/frontend-role-authority-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/frontend-role-authority.ts'
      - 'src/lib/service-request-rbac.ts'
      - 'src/lib/service-request-scope.ts'
      - 'backend/app/models/user.py'
      - 'scripts/check-frontend-role-authority-contract.ts'
      - '.github/workflows/frontend-role-authority-contract.yml'

permissions:
  contents: read

jobs:
  role-authority-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Verify frontend role authority parity
        run: bun scripts/check-frontend-role-authority-contract.ts
