name: Temporary low-bandwidth wiring

on:
  push:
    branches:
      - work/low-bandwidth-offline-first

permissions:
  contents: write

concurrency:
  group: temporary-low-bandwidth-wiring
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/low-bandwidth-offline-first
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire browser and backend integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Backend middleware import + registration.
          main_path = Path('backend/app/main.py')
          main = main_path.read_text(encoding='utf-8')
          if 'from app.middleware.idempotency import IdempotencyMiddleware' not in main:
              anchor = 'from app.middleware.audit import AuditMiddleware\n'
              if anchor not in main:
                  raise SystemExit('main.py audit middleware import anchor missing')
              main = main.replace(
                  anchor,
                  anchor + 'from app.middleware.idempotency import IdempotencyMiddleware\n',
                  1,
              )
          if 'app.add_middleware(IdempotencyMiddleware)' not in main:
              anchor = 'app.add_middleware(RequestLoggingMiddleware)'
              if anchor not in main:
                  raise SystemExit('main.py RequestLoggingMiddleware registration anchor missing')
              main = main.replace(
                  anchor,
                  'app.add_middleware(IdempotencyMiddleware)\n' + anchor,
                  1,
              )
          main_path.write_text(main, encoding='utf-8')

          # Root layout mounts the PWA bootstrap exactly once.
          layout_path = Path('src/app/layout.tsx')
          layout = layout_path.read_text(encoding='utf-8')
          if "@/components/pwa/pwa-bootstrap" not in layout:
              import_lines = list(re.finditer(r'^import .*$', layout, flags=re.MULTILINE))
              if not import_lines:
                  raise SystemExit('layout.tsx has no import anchor')
              insert_at = import_lines[-1].end()
              layout = (
                  layout[:insert_at]
                  + "\nimport { PwaBootstrap } from '@/components/pwa/pwa-bootstrap'"
                  + layout[insert_at:]
              )
          if '<PwaBootstrap />' not in layout:
              body_match = re.search(r'<body(?:\s[^>]*)?>', layout)
              if not body_match:
                  raise SystemExit('layout.tsx body tag anchor missing')
              layout = (
                  layout[:body_match.end()]
                  + '\n        <PwaBootstrap />'
                  + layout[body_match.end():]
              )
          layout_path.write_text(layout, encoding='utf-8')

          # Add a manifest link dynamically as a fallback for any Next metadata layout.
          bootstrap_path = Path('src/components/pwa/pwa-bootstrap.tsx')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          if "rel = 'manifest'" not in bootstrap:
              anchor = '    setOnline(navigator.onLine)\n\n'
              if anchor not in bootstrap:
                  raise SystemExit('pwa-bootstrap online anchor missing')
              addition = (
                  "    setOnline(navigator.onLine)\n\n"
                  "    if (!document.querySelector('link[rel=\"manifest\"]')) {\n"
                  "      const manifest = document.createElement('link')\n"
                  "      manifest.rel = 'manifest'\n"
                  "      manifest.href = '/manifest.webmanifest'\n"
                  "      document.head.appendChild(manifest)\n"
                  "    }\n\n"
              )
              bootstrap = bootstrap.replace(anchor, addition, 1)
          bootstrap_path.write_text(bootstrap, encoding='utf-8')

          # Local fetch wrapper: only the root service-request creation mutation gets a stable key.
          client_path = Path('src/lib/service-requests-api.ts')
          client = client_path.read_text(encoding='utf-8')
          marker = 'const eadminNativeFetch = globalThis.fetch.bind(globalThis)'
          if marker not in client:
              wrapper = '''import { getStableIdempotencyKey } from '@/lib/idempotency-client'

const eadminNativeFetch = globalThis.fetch.bind(globalThis)

const fetch = async (input: RequestInfo | URL, init?: RequestInit): Promise<Response> => {
  const rawUrl = typeof input === 'string'
    ? input
    : input instanceof URL
      ? input.toString()
      : input.url
  const requestMethod = (
    init?.method
    || (typeof Request !== 'undefined' && input instanceof Request ? input.method : 'GET')
  ).toUpperCase()

  let pathname = ''
  try {
    pathname = new URL(rawUrl, 'http://eadmin.local').pathname
  } catch {
    return eadminNativeFetch(input, init)
  }

  if (
    requestMethod === 'POST'
    && (pathname === '/api/v1/service-requests' || pathname === '/api/v1/service-requests/')
    && typeof init?.body === 'string'
  ) {
    try {
      const payload = JSON.parse(init.body) as unknown
      const idempotencyKey = await getStableIdempotencyKey(payload)
      const headers = new Headers(
        init.headers
        || (typeof Request !== 'undefined' && input instanceof Request ? input.headers : undefined),
      )
      if (!headers.has('Idempotency-Key')) {
        headers.set('Idempotency-Key', idempotencyKey)
      }
      return eadminNativeFetch(input, { ...init, headers })
    } catch {
      // Invalid/non-JSON bodies remain server-authoritative and are not replay-cached.
    }
  }

  return eadminNativeFetch(input, init)
}

'''
              client = wrapper + client
          client_path.write_text(client, encoding='utf-8')

          # Extend static policy so the bootstrap must actually be mounted.
          policy_path = Path('scripts/ops/check_low_bandwidth_policy.py')
          policy = policy_path.read_text(encoding='utf-8')
          if '"layout": ROOT / "src/app/layout.tsx"' not in policy:
              anchor = '        "bootstrap": ROOT / "src/components/pwa/pwa-bootstrap.tsx",\n'
              if anchor not in policy:
                  raise SystemExit('low-bandwidth policy bootstrap path anchor missing')
              policy = policy.replace(
                  anchor,
                  anchor + '        "layout": ROOT / "src/app/layout.tsx",\n',
                  1,
              )
          if 'Root layout must mount PwaBootstrap' not in policy:
              anchor = '    client_idempotency = text["client_idempotency"]\n'
              if anchor not in policy:
                  raise SystemExit('low-bandwidth policy client anchor missing')
              assertion = (
                  '    layout = text["layout"]\n'
                  '    require("PwaBootstrap" in layout, "Root layout must mount PwaBootstrap", errors)\n'
                  '    require("manifest.webmanifest" in bootstrap, "PWA bootstrap must expose the manifest", errors)\n\n'
              )
              policy = policy.replace(anchor, assertion + anchor, 1)
          policy_path.write_text(policy, encoding='utf-8')

          # Remove this helper from the merge candidate.
          Path('.github/workflows/temp-low-bandwidth-wire.yml').unlink()
          PY

          python -m compileall -q backend/app backend/tests scripts/ops
          git diff --check

      - name: Commit final wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "wire(network): mount privacy-safe PWA and submission idempotency"
          git push origin HEAD:work/low-bandwidth-offline-first
