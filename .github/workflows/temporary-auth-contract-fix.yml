name: Temporary Auth Contract Fix

on:
  push:
    branches:
      - agent/p0-ci-remediation-2

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-ci-remediation-2

      - name: Patch auth contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/app/api/auth.py')
          text = path.read_text(encoding='utf-8')

          old = '    role: RoleEnum = RoleEnum.AGENT\n    institution: str | None = None\n\n    @field_validator("password")'
          new = '    role: RoleEnum = RoleEnum.CITOYEN\n    institution: str | None = None\n\n    @field_validator("password")'
          if old not in text:
              raise SystemExit('Public UserCreate role pattern not found')
          text = text.replace(old, new, 1)

          old_return = "**{k: getattr(user, k) for k in ['id', 'email', 'full_name', 'role', 'institution', 'is_active', 'created_at']},"
          new_return = "**{k: getattr(user, k) for k in ['id', 'email', 'full_name', 'role', 'institution', 'is_active', 'mfa_enabled', 'created_at']},"
          if text.count(old_return) < 2:
              raise SystemExit('Expected register/admin response patterns not found')
          text = text.replace(old_return, new_return, 2)

          path.write_text(text, encoding='utf-8')

      - name: Commit contract fix
        shell: bash
        run: |
          if git diff --quiet -- backend/app/api/auth.py; then
            echo 'Auth contract already fixed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/api/auth.py
          git commit -m 'fix(auth): align public citizen contract and MFA response'
          git push origin HEAD:agent/p0-ci-remediation-2
