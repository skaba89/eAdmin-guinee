name: P0 Government Readiness Gates

on:
  push:
    branches:
      - 'agent/**'
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: p0-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eadmin_test
          POSTGRES_USER: eadmin
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadmin -d eadmin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://eadmin:ci-test-password@localhost:5432/eadmin_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_ENDPOINT: localhost:9000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Pytest with coverage gate
        run: pytest tests -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: PostgreSQL migration chain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eadmin_migrations
          POSTGRES_USER: eadmin
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadmin -d eadmin_migrations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://eadmin:ci-test-password@localhost:5432/eadmin_migrations
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inspect Alembic graph
        run: |
          echo '=== migration files ==='
          ls -1 alembic/versions
          echo '=== revisions ==='
          grep -H -E "^(revision|down_revision)[[:space:]]*=" alembic/versions/*.py || true
          echo '=== heads ==='
          alembic heads --verbose
          echo '=== history ==='
          alembic history --verbose

      - name: Upgrade database to head
        run: alembic upgrade head

      - name: Verify single migration head
        run: |
          heads=$(alembic heads | grep -c '(head)')
          test "$heads" -eq 1

  frontend-quality:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_NAME: eAdmin CI

  security:
    name: Dependency and secret security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        # Signed, immutable v0.36.0 release commit. Pin the SHA because
        # trivy-action had a 2026 supply-chain incident involving tags.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  docker-build:
    name: Reproducible Docker builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --pull -t eadmin-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build --pull -t eadmin-frontend:${{ github.sha }} .

  p0-gate:
    name: P0 aggregate gate
    if: always()
    needs:
      - backend-quality
      - migrations
      - frontend-quality
      - security
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Require every P0 gate
        env:
          BACKEND: ${{ needs.backend-quality.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          FRONTEND: ${{ needs.frontend-quality.result }}
          SECURITY: ${{ needs.security.result }}
          DOCKER: ${{ needs.docker-build.result }}
        run: |
          echo "backend=$BACKEND migrations=$MIGRATIONS frontend=$FRONTEND security=$SECURITY docker=$DOCKER"
          test "$BACKEND" = success
          test "$MIGRATIONS" = success
          test "$FRONTEND" = success
          test "$SECURITY" = success
          test "$DOCKER" = success
