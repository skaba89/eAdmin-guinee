name: Temporary SOC preflight

on:
  push:
    branches:
      - work/soc-siem-incident-response

permissions:
  contents: write

concurrency:
  group: temporary-soc-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/soc-siem-incident-response
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure complete SOC wiring and cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def update(path: str, transform):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new = transform(text)
              p.write_text(new, encoding='utf-8')

          def config_fix(text: str) -> str:
              if 'SOC_INGEST_ENABLED: bool = False' not in text:
                  anchor = '    OIDC_AUTO_PROVISION: bool = False\n\n'
                  if anchor not in text:
                      raise SystemExit('config OIDC anchor missing')
                  text = text.replace(
                      anchor,
                      anchor
                      + '    # Machine SOC ingestion is disabled until a signed collector is configured.\n'
                      + '    SOC_INGEST_ENABLED: bool = False\n'
                      + '    SOC_INGEST_HMAC_SECRET: str = ""\n'
                      + '    SOC_INGEST_MAX_SKEW_SECONDS: int = 300\n\n',
                      1,
                  )
              if 'SOC_INGEST_MAX_SKEW_SECONDS must be between 60 and 900 seconds.' not in text:
                  anchor = '        return self\n\n    @property\n    def is_development'
                  if anchor not in text:
                      raise SystemExit('config validator anchor missing')
                  validation = (
                      '        if not 60 <= self.SOC_INGEST_MAX_SKEW_SECONDS <= 900:\n'
                      '            raise ValueError("SOC_INGEST_MAX_SKEW_SECONDS must be between 60 and 900 seconds.")\n'
                      '        if self.SOC_INGEST_ENABLED and len(self.SOC_INGEST_HMAC_SECRET) < 32:\n'
                      '            raise ValueError(\n'
                      '                "SOC ingestion is enabled but SOC_INGEST_HMAC_SECRET is shorter than 32 characters."\n'
                      '            )\n\n'
                  )
                  text = text.replace(anchor, validation + anchor, 1)
              return text

          def main_fix(text: str) -> str:
              if '\n    soc,\n' not in text:
                  anchor = '    security_hardening,\n'
                  if anchor not in text:
                      raise SystemExit('main import anchor missing')
                  text = text.replace(anchor, anchor + '    soc,\n', 1)
              if 'soc.ingest_router' not in text:
                  anchor = (
                      'app.include_router(\n'
                      '    identity_federation.public_router,\n'
                      '    prefix="/api/v1/auth/sso",\n'
                      '    tags=["SSO OIDC"],\n'
                      ')\n'
                  )
                  if anchor not in text:
                      raise SystemExit('main SSO router anchor missing')
                  text = text.replace(
                      anchor,
                      anchor
                      + 'app.include_router(\n'
                      + '    soc.ingest_router,\n'
                      + '    prefix="/api/v1/soc",\n'
                      + '    tags=["SOC - ingestion machine"],\n'
                      + ')\n',
                      1,
                  )
              if 'soc.router' not in text:
                  anchor = 'app.include_router(metrics.router, tags=["Métriques"])'
                  if anchor not in text:
                      raise SystemExit('main metrics anchor missing')
                  text = text.replace(
                      anchor,
                      'app.include_router(\n'
                      '    soc.router,\n'
                      '    prefix="/api/v1/soc",\n'
                      '    tags=["SOC et réponse à incident"],\n'
                      '    dependencies=rls_dependencies,\n'
                      ')\n'
                      + anchor,
                      1,
                  )
              return text

          def service_fix(text: str) -> str:
              if 'if connection.dialect.name != "postgresql":' in text:
                  return text
              anchor = '    original = connection.execute(\n'
              if anchor not in text:
                  raise SystemExit('SOC mirror RLS anchor missing')
              values = '''SecuritySignal.__table__.insert().values(
                  id=uuid.uuid4(),
                  source="application_audit",
                  external_event_id=f"audit:{target_id}",
                  event_type=event_type[:150],
                  category=(category or "audit")[:100],
                  severity=severity,
                  tenant_id=tenant_id[:100],
                  institution_id=str(institution_id)[:100] if institution_id else None,
                  actor_id=actor_id,
                  resource_type=str(resource_type)[:100] if resource_type else None,
                  resource_id=str(resource_id)[:255] if resource_id else None,
                  correlation_key=correlation_key,
                  network_source_hash=network_hash,
                  user_agent_hash=agent_hash,
                  details=normalized_details,
                  occurred_at=occurred_at,
              )'''
              return text.replace(
                  anchor,
                  '    if connection.dialect.name != "postgresql":\n'
                  '        connection.execute(\n'
                  f'            {values}\n'
                  '        )\n'
                  '        return\n\n'
                  + anchor,
                  1,
              )

          def api_fix(text: str) -> str:
              text = text.replace('import json\n', '')
              if 'from pydantic import BaseModel, Field, ValidationError' not in text:
                  text = text.replace(
                      'from pydantic import BaseModel, Field\n',
                      'from pydantic import BaseModel, Field, ValidationError\n',
                      1,
                  )
              text = text.replace(
                  '    except Exception as exc:\n        raise HTTPException(status_code=422, detail="Signal SOC invalide.") from exc\n',
                  '    except ValidationError as exc:\n        raise HTTPException(status_code=422, detail="Signal SOC invalide.") from exc\n',
                  1,
              )
              return text

          update('backend/app/config.py', config_fix)
          update('backend/app/main.py', main_fix)
          update('backend/app/services/soc_service.py', service_fix)
          update('backend/app/api/soc.py', api_fix)
          update(
              'backend/tests/test_soc_service.py',
              lambda text: text.replace(
                  'severity="warning" if False else "high",',
                  'severity="high",',
              ),
          )

          required = {
              'backend/app/config.py': [
                  'SOC_INGEST_ENABLED: bool = False',
                  'SOC_INGEST_HMAC_SECRET: str = ""',
                  'SOC_INGEST_MAX_SKEW_SECONDS must be between 60 and 900 seconds.',
              ],
              'backend/app/main.py': ['soc.ingest_router', 'soc.router'],
              'backend/app/services/soc_service.py': [
                  'event.listen(AuditLog, "after_insert"',
                  'if connection.dialect.name != "postgresql":',
                  'SOC_SERVICE',
              ],
              'backend/app/api/soc.py': [
                  'ValidationError',
                  'X-EAdmin-SOC-Signature',
                  'hmac.compare_digest',
              ],
              'scripts/ops/check_soc_governance.py': ['SOC governance policy: PASS'],
              '.github/workflows/soc-governance.yml': ['SOC Governance Gate'],
          }
          for path, markers in required.items():
              text = Path(path).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'{path}: missing marker {marker!r}')

          for helper in Path('.github/workflows').glob('temp-soc-*.yml'):
              helper.unlink()
          PY

          python -m compileall -q backend/app backend/tests backend/scripts scripts/ops
          git diff --check
          git status --short

      - name: Commit preflight result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preflight already satisfied"
            exit 0
          fi
          git commit -m "fix(soc): finalize production wiring and remove temporary workflows"
          git push origin HEAD:work/soc-siem-incident-response
