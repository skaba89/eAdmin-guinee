name: Temporary Grounded AI Wire

on:
  push:
    branches:
      - work/grounded-ai

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/grounded-ai

      - name: Wire grounded backend and safe frontend labels
        shell: python
        run: |
          from pathlib import Path

          main = Path('backend/app/main.py')
          text = main.read_text(encoding='utf-8')
          old = 'from app.api import (\n    ai,\n    analytics,\n'
          new = 'from app.api import (\n    ai,\n    ai_grounded,\n    analytics,\n'
          if old not in text:
              raise SystemExit('main import anchor missing')
          text = text.replace(old, new, 1)

          old = '''app.include_router(\n    ai.router,\n    prefix="/api/v1/ai",\n    tags=["Intelligence Artificielle"],\n    dependencies=rls_dependencies,\n)'''
          new = '''# Grounded routes intentionally precede the historical AI router. Duplicate\n# paths are therefore handled by the sourced, human-in-the-loop implementation.\napp.include_router(\n    ai_grounded.router,\n    prefix="/api/v1/ai",\n    tags=["Assistant administratif sourcé"],\n    dependencies=rls_dependencies,\n)\napp.include_router(\n    ai.router,\n    prefix="/api/v1/ai",\n    tags=["Intelligence Artificielle (compatibilité)"],\n    dependencies=rls_dependencies,\n)'''
          if old not in text:
              raise SystemExit('AI include anchor missing')
          text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          api = Path('backend/app/api/ai_grounded.py')
          text = api.read_text(encoding='utf-8')
          replacements = {
              'grounded_government_ai.summarize_document(db, str(request.document_id))':
                  'grounded_government_ai.summarize_document(db, request.document_id)',
              'grounded_government_ai.summarize_correspondence(db, str(request.courrier_id))':
                  'grounded_government_ai.summarize_correspondence(db, request.courrier_id)',
              '            str(request.courrier_id),\n            request.instructions,':
                  '            request.courrier_id,\n            request.instructions,',
              '            str(request.document_id),\n            _tenant_id(current_user),':
                  '            request.document_id,\n            _tenant_id(current_user),',
              '            str(request.document_id),\n            request.fields,':
                  '            request.document_id,\n            request.fields,',
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f'grounded API anchor missing: {old_value!r}')
              text = text.replace(old_value, new_value, 1)
          api.write_text(text, encoding='utf-8')

          page = Path('src/components/app/ai-assistant-page.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace("label: 'Vérifier éligibilité'", "label: 'Trouver une démarche'", 1)
          text = text.replace(
              "description: 'Vérifiez si vous êtes éligible pour un service'",
              "description: 'Recherchez une démarche dans le catalogue serveur'",
              1,
          )
          text = text.replace(
              "prompt: 'Vérifiez si je suis éligible pour [service]'",
              "prompt: 'Quelle démarche correspond à ce besoin : [décrivez votre besoin] ?'",
              1,
          )
          text = text.replace("label: 'Suivi de demande'", "label: 'Informations sourcées'", 1)
          text = text.replace(
              "description: 'Suivez l\\'état de votre demande'",
              "description: 'Obtenez uniquement les informations présentes au catalogue'",
              1,
          )
          text = text.replace(
              "prompt: 'Je veux suivre ma demande référence [ref]'",
              "prompt: 'Donnez-moi les informations sourcées sur la démarche [nom]'",
              1,
          )
          text = text.replace('Assistant IA eAdmin Guinée', 'Assistant administratif sourcé', 1)
          text = text.replace('Posez vos questions sur les démarches administratives', 'Réponses fondées sur le catalogue administratif serveur', 1)
          page.write_text(text, encoding='utf-8')

          store = Path('src/store/ai-chat-store.ts')
          text = store.read_text(encoding='utf-8')
          old = '''      addMessage({\n        role: 'assistant',\n        content: message,\n        grounded: data?.grounded === true,\n        confidence: typeof data?.confidence === 'number' ? data.confidence : 0,\n        sources: Array.isArray(data?.sources)\n          ? data.sources.filter((source): source is string => typeof source === 'string')\n          : [],\n      })'''
          new = '''      const sources = Array.isArray(data?.sources)\n        ? data.sources.filter((source): source is string => typeof source === 'string')\n        : []\n      const sourcedContent = sources.length > 0\n        ? `${message}\\n\\nSources :\\n${sources.map((source) => `• ${source}`).join('\\n')}`\n        : message\n\n      addMessage({\n        role: 'assistant',\n        content: sourcedContent,\n        grounded: data?.grounded === true,\n        confidence: typeof data?.confidence === 'number' ? data.confidence : 0,\n        sources,\n      })'''
          if old not in text:
              raise SystemExit('AI store source anchor missing')
          text = text.replace(old, new, 1)
          store.write_text(text, encoding='utf-8')

      - name: Commit grounded wiring
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py backend/app/api/ai_grounded.py src/components/app/ai-assistant-page.tsx src/store/ai-chat-store.ts
          git commit -m 'security(ai): prioritize grounded sourced assistant routes'
          git push origin HEAD:work/grounded-ai
