name: IAM Governance Gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - work/iam-abac-governance
      - agent/iam-effective-authorization
  workflow_dispatch:

concurrency:
  group: iam-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iam-governance:
    name: ABAC, delegation, SoD and break-glass invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eadmin_iam
          POSTGRES_USER: eadmin
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadmin -d eadmin_iam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://eadmin:ci-test-password@localhost:5432/eadmin_iam
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_ENDPOINT: localhost:9000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Enforce static IAM governance policy
        run: python scripts/ops/check_iam_governance.py

      - name: Lint IAM implementation
        run: |
          cd backend
          ruff check \
            app/models/access_grant.py \
            app/services/authorization_service.py \
            app/middleware/rbac.py \
            app/api/access_control.py \
            app/api/users.py \
            app/api/auth_hardening.py \
            tests/test_iam_governance.py
          cd ..
          ruff check scripts/ops/check_iam_governance.py

      - name: Test adversarial IAM behavior
        working-directory: backend
        run: pytest -q tests/test_iam_governance.py
