name: Municipality Service Request RLS Gate

on:
  pull_request:
    paths:
      - 'backend/app/api/service_requests.py'
      - 'backend/app/api/service_catalog.py'
      - 'backend/app/api/users.py'
      - 'backend/app/database.py'
      - 'backend/app/models/service_request.py'
      - 'backend/app/models/institution_service_assignment.py'
      - 'backend/app/services/service_catalog.py'
      - 'backend/alembic/versions/municipality_service_request_routing.py'
      - 'backend/tests/test_municipality_service_request_routing.py'
      - '.github/workflows/municipality-service-request-rls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  municipality-service-request-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eadmin
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: eadmin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadmin -d eadmin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://eadmin:ci-test-password@localhost:5432/eadmin_test
      PGPASSWORD: ci-test-password
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply schema and seed governed baseline
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/seed_recette_data.py

      - name: Prepare two-mairie RLS fixtures
        shell: bash
        run: |
          set -euo pipefail
          TENANT_ID="$(psql -h localhost -U eadmin -d eadmin_test -Atc "SELECT id FROM tenants ORDER BY id LIMIT 1")"
          CITIZEN_ID="$(psql -h localhost -U eadmin -d eadmin_test -Atc "SELECT id FROM users ORDER BY created_at LIMIT 1")"
          test -n "$TENANT_ID"
          test -n "$CITIZEN_ID"

          psql -h localhost -U eadmin -d eadmin_test -v ON_ERROR_STOP=1 \
            -v tenant_id="$TENANT_ID" -v citizen_id="$CITIZEN_ID" <<'SQL'
          INSERT INTO institutions (id, tenant_id, name, type, parent_id, is_active)
          VALUES
            ('ci-mairie-a', :'tenant_id', 'CI Mairie A', 'mairie', NULL, TRUE),
            ('ci-service-a', :'tenant_id', 'CI Etat civil A', 'service', 'ci-mairie-a', TRUE),
            ('ci-mairie-b', :'tenant_id', 'CI Mairie B', 'mairie', NULL, TRUE),
            ('ci-service-b', :'tenant_id', 'CI Etat civil B', 'service', 'ci-mairie-b', TRUE)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO institution_service_assignments
            (id, tenant_id, institution_id, service_id, service_institution_id, is_active)
          VALUES
            ('11111111-1111-4111-8111-111111111111', :'tenant_id', 'ci-mairie-a', 'ci-acte-a', 'ci-service-a', TRUE),
            ('22222222-2222-4222-8222-222222222222', :'tenant_id', 'ci-mairie-b', 'ci-acte-b', 'ci-service-b', TRUE)
          ON CONFLICT (tenant_id, institution_id, service_id) DO UPDATE
            SET service_institution_id = EXCLUDED.service_institution_id, is_active = TRUE;

          INSERT INTO service_requests (
            id, reference, service_id, service_name, category, category_id,
            citizen_id, citizen_name, citizen_first_name, citizen_nin,
            citizen_phone, citizen_email, citizen_address, motif,
            required_documents, status, assigned_service, timeline,
            deadline_days, deadline_date, delivery_mode,
            tenant_id, institution_id, service_institution_id
          ) VALUES
            (
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1', 'CI-MAIRIE-A-NEW', 'ci-acte-a', 'Acte A',
              'Etat civil', 'etat-civil', :'citizen_id', 'Diallo', 'Aminata', 'CI-NIN-A1',
              '+224600000001', 'a1@ci.test', 'Commune A', 'Isolation A nouvelle', '[]'::json,
              'soumise', 'CI Etat civil A', '[]'::json, 5, now() + interval '5 days', 'guichet',
              :'tenant_id', 'ci-mairie-a', 'ci-service-a'
            ),
            (
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2', 'CI-MAIRIE-A-LEGACY', 'ci-acte-a', 'Acte A',
              'Etat civil', 'etat-civil', :'citizen_id', 'Bah', 'Mamadou', 'CI-NIN-A2',
              '+224600000002', 'a2@ci.test', 'Commune A', 'Isolation A historique', '[]'::json,
              'soumise', 'CI Etat civil A', '[]'::json, 5, now() + interval '5 days', 'guichet',
              :'tenant_id', 'ci-mairie-a', NULL
            ),
            (
              'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1', 'CI-MAIRIE-B-NEW', 'ci-acte-b', 'Acte B',
              'Etat civil', 'etat-civil', :'citizen_id', 'Camara', 'Fatoumata', 'CI-NIN-B1',
              '+224600000003', 'b1@ci.test', 'Commune B', 'Isolation B nouvelle', '[]'::json,
              'soumise', 'CI Etat civil B', '[]'::json, 5, now() + interval '5 days', 'guichet',
              :'tenant_id', 'ci-mairie-b', 'ci-service-b'
            )
          ON CONFLICT (reference) DO NOTHING;

          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'eadmin_runtime_ci') THEN
              CREATE ROLE eadmin_runtime_ci NOLOGIN NOSUPERUSER NOBYPASSRLS;
            END IF;
          END $$;
          GRANT USAGE ON SCHEMA public TO eadmin_runtime_ci;
          GRANT SELECT ON service_requests, institution_service_assignments TO eadmin_runtime_ci;
          SQL

          echo "TENANT_ID=$TENANT_ID" >> "$GITHUB_ENV"

      - name: Prove Agent A sees only service A including historical request
        run: |
          result="$(psql -h localhost -U eadmin -d eadmin_test -At -v ON_ERROR_STOP=1 <<SQL
          SET ROLE eadmin_runtime_ci;
          SELECT set_config('app.current_tenant_id', '$TENANT_ID', false);
          SELECT set_config('app.current_institution_id', 'ci-service-a', false);
          SELECT set_config('app.current_role', 'AGENT', false);
          SELECT string_agg(reference, ',' ORDER BY reference)
          FROM service_requests
          WHERE reference LIKE 'CI-MAIRIE-%';
          SQL
          )"
          test "$(printf '%s\n' "$result" | tail -n1)" = 'CI-MAIRIE-A-LEGACY,CI-MAIRIE-A-NEW'

      - name: Prove Agent B sees only service B
        run: |
          result="$(psql -h localhost -U eadmin -d eadmin_test -At -v ON_ERROR_STOP=1 <<SQL
          SET ROLE eadmin_runtime_ci;
          SELECT set_config('app.current_tenant_id', '$TENANT_ID', false);
          SELECT set_config('app.current_institution_id', 'ci-service-b', false);
          SELECT set_config('app.current_role', 'AGENT', false);
          SELECT string_agg(reference, ',' ORDER BY reference)
          FROM service_requests
          WHERE reference LIKE 'CI-MAIRIE-%';
          SQL
          )"
          test "$(printf '%s\n' "$result" | tail -n1)" = 'CI-MAIRIE-B-NEW'

      - name: Prove each mairie sees only requests addressed to it
        run: |
          for pair in 'ci-mairie-a:CI-MAIRIE-A-LEGACY,CI-MAIRIE-A-NEW' 'ci-mairie-b:CI-MAIRIE-B-NEW'; do
            institution="${pair%%:*}"
            expected="${pair#*:}"
            result="$(psql -h localhost -U eadmin -d eadmin_test -At -v ON_ERROR_STOP=1 <<SQL
          SET ROLE eadmin_runtime_ci;
          SELECT set_config('app.current_tenant_id', '$TENANT_ID', false);
          SELECT set_config('app.current_institution_id', '$institution', false);
          SELECT set_config('app.current_role', 'MAIRIE', false);
          SELECT string_agg(reference, ',' ORDER BY reference)
          FROM service_requests
          WHERE reference LIKE 'CI-MAIRIE-%';
          SQL
          )"
            test "$(printf '%s\n' "$result" | tail -n1)" = "$expected"
          done

      - name: Prove service teams cannot read another mairie assignment
        run: |
          for pair in 'ci-service-a:ci-mairie-a' 'ci-service-b:ci-mairie-b'; do
            service="${pair%%:*}"
            expected="${pair#*:}"
            result="$(psql -h localhost -U eadmin -d eadmin_test -At -v ON_ERROR_STOP=1 <<SQL
          SET ROLE eadmin_runtime_ci;
          SELECT set_config('app.current_tenant_id', '$TENANT_ID', false);
          SELECT set_config('app.current_institution_id', '$service', false);
          SELECT set_config('app.current_role', 'AGENT', false);
          SELECT string_agg(institution_id, ',' ORDER BY institution_id)
          FROM institution_service_assignments
          WHERE institution_id LIKE 'ci-mairie-%';
          SQL
          )"
            test "$(printf '%s\n' "$result" | tail -n1)" = "$expected"
          done
