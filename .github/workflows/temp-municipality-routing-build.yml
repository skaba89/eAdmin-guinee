name: Temporary Municipality Routing Build

on:
  push:
    branches:
      - scratch/municipality-routing-build

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v4
        with:
          ref: scratch/municipality-routing-build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply deterministic routing patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_municipality_routing_patch.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          skip_next = False
          for line in lines:
              if skip_next:
                  skip_next = False
                  continue
              if line.strip() == 'if text.count(old) != 1:':
                  skip_next = True
                  continue
              output.append(line)
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          python scripts/apply_municipality_routing_patch.py

      - name: Verify Alembic has one head
        working-directory: backend
        run: |
          heads="$(alembic heads | grep -c '(head)' || true)"
          alembic heads
          test "$heads" = '1'

      - name: Lint changed backend surface
        working-directory: backend
        run: ruff check app/models/institution_service_assignment.py app/models/service_request.py app/services/service_catalog.py app/api/service_requests.py app/api/service_catalog.py app/api/users.py tests/test_municipality_service_request_routing.py

      - name: Run focused municipal routing tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
          ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
          MINIO_ACCESS_KEY: ci-minio
          MINIO_SECRET_KEY: ci-minio-secret
        run: pytest tests/test_municipality_service_request_routing.py tests/test_service_request_hierarchy_scope.py tests/test_public_service_catalog.py tests/test_mairie_tenant_isolation.py -q

      - name: Remove temporary build helpers
        run: |
          rm -f scripts/apply_municipality_routing_patch.py
          rm -f .github/workflows/temp-municipality-routing-build.yml

      - name: Commit tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(requests): isolate municipal services and teams'
          git push origin HEAD:scratch/municipality-routing-build
