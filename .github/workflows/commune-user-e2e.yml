name: Commune User Creation E2E

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.local.yml'
      - '.github/workflows/commune-user-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commune-users-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env.local.ci <<'EOF'
          POSTGRES_PASSWORD=ci_postgres_password_2026
          REDIS_PASSWORD=ci_redis_password_2026
          MINIO_ROOT_USER=eadmin
          MINIO_ROOT_PASSWORD=ci_minio_password_2026
          SECRET_KEY=ci_secret_key_0123456789abcdef0123456789abcdef0123456789abcdef
          ENCRYPTION_KEY=ci_encryption_key_0123456789abcdef0123456789abcdef
          NEXT_PUBLIC_ENCRYPTION_KEY=ci_frontend_encryption_0123456789abcdef
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=Grafana!2026Aa-ci-password
          LOCAL_TEST_PASSWORD=CiLocal!2026Aa-test-password
          LOCAL_TEST_DOMAIN=eadmin.test
          LOCAL_SUPERADMIN_EMAIL=superadmin@eadmin.test
          LOCAL_FRONTEND_PORT=3000
          LOCAL_BACKEND_PORT=8000
          LOCAL_POSTGRES_PORT=5433
          LOCAL_REDIS_PORT=6380
          LOCAL_MINIO_API_PORT=9000
          LOCAL_MINIO_CONSOLE_PORT=9001
          LOCAL_MAILPIT_SMTP_PORT=1025
          LOCAL_MAILPIT_UI_PORT=8025
          LOCAL_PROMETHEUS_PORT=9090
          LOCAL_GRAFANA_PORT=3001
          EOF

      - name: Build backend
        run: docker compose --env-file .env.local.ci -f docker-compose.local.yml build backend

      - name: Start backend stack
        run: |
          set -euo pipefail
          docker compose --env-file .env.local.ci -f docker-compose.local.yml up -d postgres redis minio minio-init mailpit
          docker compose --env-file .env.local.ci -f docker-compose.local.yml run --rm --no-deps backend alembic upgrade head
          docker compose --env-file .env.local.ci -f docker-compose.local.yml run --rm --no-deps backend python -m app.bootstrap_runtime
          docker compose --env-file .env.local.ci -f docker-compose.local.yml up -d backend
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo 'Backend healthy'
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.local.ci -f docker-compose.local.yml logs --tail 200 backend
          exit 1

      - name: Verify commune scope function without test-only dependencies
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T backend python - <<'PY'
          import uuid
          from fastapi import HTTPException
          from app.api.users import UserCreate, _target_scope_for_create
          from app.config import settings
          from app.models.user import RoleEnum, User

          actor = User(
              id=uuid.uuid4(),
              email='admin.ratoma.scope@ci.eadmin-guinee.org',
              hashed_password='not-used',
              full_name='Admin Ratoma Scope',
              role=RoleEnum.ADMIN,
              tenant_id=settings.TENANT_DEFAULT_ID,
              institution_id='mairie-ratoma-e2e',
              is_active=True,
          )

          def payload(institution_id: str) -> UserCreate:
              return UserCreate(
                  email='agent.scope@ci.eadmin-guinee.org',
                  password='CiScope!2026Aa-test-password',
                  full_name='Agent Scope',
                  role=RoleEnum.AGENT,
                  tenant_id=settings.TENANT_DEFAULT_ID,
                  institution_id=institution_id,
              )

          assert _target_scope_for_create(actor, payload('mairie-ratoma-e2e')) == (
              settings.TENANT_DEFAULT_ID,
              'mairie-ratoma-e2e',
          )

          try:
              _target_scope_for_create(actor, payload('mairie-matoto-e2e'))
          except HTTPException as exc:
              assert exc.status_code == 403, exc.status_code
          else:
              raise AssertionError('Cross-commune creation must be rejected with HTTP 403')

          print('Scope function OK: own commune allowed, cross-commune rejected')
          PY

      - name: Seed Ratoma and Matoto communes
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
            psql -U eadmin -d eadmin -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO institutions (id, tenant_id, name, type, is_active, settings)
          VALUES
            ('mairie-ratoma-e2e', 'republique-de-guinee', 'Mairie de Ratoma E2E', 'mairie', TRUE, '{"e2e": true}'::json),
            ('mairie-matoto-e2e', 'republique-de-guinee', 'Mairie de Matoto E2E', 'mairie', TRUE, '{"e2e": true}'::json)
          ON CONFLICT (id) DO UPDATE SET
            tenant_id = EXCLUDED.tenant_id,
            name = EXCLUDED.name,
            type = EXCLUDED.type,
            is_active = TRUE;
          SQL

      - name: Create and authenticate users per commune
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          SUPER_PASSWORD='CiLocal!2026Aa-test-password'
          USER_PASSWORD='CiCommune!2026Aa-test-password'
          DOMAIN='ci.eadmin-guinee.org'

          login_token() {
            local email="$1"
            local password="$2"
            curl -fsS -X POST "${API}/auth/login" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "username=${email}" \
              --data-urlencode "password=${password}" \
              | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])"
          }

          create_user() {
            local token="$1"
            local email="$2"
            local full_name="$3"
            local role="$4"
            local institution_id="$5"
            local output="$6"
            curl -sS -o "${output}" -w '%{http_code}' -X POST "${API}/users" \
              -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"${email}\",\"password\":\"${USER_PASSWORD}\",\"full_name\":\"${full_name}\",\"role\":\"${role}\",\"tenant_id\":\"republique-de-guinee\",\"institution_id\":\"${institution_id}\"}"
          }

          assert_status() {
            local expected="$1"
            local actual="$2"
            local label="$3"
            local body="$4"
            echo "${label}: HTTP ${actual}"
            if [ "${actual}" != "${expected}" ]; then
              cat "${body}" || true
              exit 1
            fi
          }

          SUPER_TOKEN="$(login_token superadmin@eadmin.test "${SUPER_PASSWORD}")"

          # Regression: application validation must not be converted to RLS 503.
          INVALID_STATUS="$(curl -sS -o /tmp/invalid-user.json -w '%{http_code}' -X POST "${API}/users" \
            -H "Authorization: Bearer ${SUPER_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"email":"not-an-email","password":"CiCommune!2026Aa-test-password","full_name":"Invalid","role":"ADMIN","tenant_id":"republique-de-guinee","institution_id":"mairie-ratoma-e2e"}')"
          assert_status 422 "${INVALID_STATUS}" 'Invalid user payload' /tmp/invalid-user.json

          RATOMA_ADMIN="admin.ratoma.e2e@${DOMAIN}"
          MATOTO_ADMIN="admin.matoto.e2e@${DOMAIN}"
          RATOMA_AGENT="agent.ratoma.e2e@${DOMAIN}"
          MATOTO_AGENT="agent.matoto.e2e@${DOMAIN}"
          RATOMA_CITIZEN="citoyen.ratoma.e2e@${DOMAIN}"
          MATOTO_CITIZEN="citoyen.matoto.e2e@${DOMAIN}"

          RATOMA_ADMIN_STATUS="$(create_user "${SUPER_TOKEN}" "${RATOMA_ADMIN}" 'Admin Ratoma E2E' ADMIN mairie-ratoma-e2e /tmp/ratoma-admin.json)"
          MATOTO_ADMIN_STATUS="$(create_user "${SUPER_TOKEN}" "${MATOTO_ADMIN}" 'Admin Matoto E2E' ADMIN mairie-matoto-e2e /tmp/matoto-admin.json)"
          assert_status 201 "${RATOMA_ADMIN_STATUS}" 'Ratoma admin creation' /tmp/ratoma-admin.json
          assert_status 201 "${MATOTO_ADMIN_STATUS}" 'Matoto admin creation' /tmp/matoto-admin.json

          DUP_ADMIN_STATUS="$(create_user "${SUPER_TOKEN}" "admin.ratoma.duplicate.e2e@${DOMAIN}" 'Duplicate Ratoma Admin' ADMIN mairie-ratoma-e2e /tmp/duplicate-admin.json)"
          assert_status 409 "${DUP_ADMIN_STATUS}" 'Second active Ratoma admin' /tmp/duplicate-admin.json

          RATOMA_TOKEN="$(login_token "${RATOMA_ADMIN}" "${USER_PASSWORD}")"
          MATOTO_TOKEN="$(login_token "${MATOTO_ADMIN}" "${USER_PASSWORD}")"

          RATOMA_AGENT_STATUS="$(create_user "${RATOMA_TOKEN}" "${RATOMA_AGENT}" 'Agent Ratoma E2E' AGENT mairie-ratoma-e2e /tmp/ratoma-agent.json)"
          RATOMA_CITIZEN_STATUS="$(create_user "${RATOMA_TOKEN}" "${RATOMA_CITIZEN}" 'Citoyen Ratoma E2E' CITOYEN mairie-ratoma-e2e /tmp/ratoma-citizen.json)"
          MATOTO_AGENT_STATUS="$(create_user "${MATOTO_TOKEN}" "${MATOTO_AGENT}" 'Agent Matoto E2E' AGENT mairie-matoto-e2e /tmp/matoto-agent.json)"
          MATOTO_CITIZEN_STATUS="$(create_user "${MATOTO_TOKEN}" "${MATOTO_CITIZEN}" 'Citoyen Matoto E2E' CITOYEN mairie-matoto-e2e /tmp/matoto-citizen.json)"
          assert_status 201 "${RATOMA_AGENT_STATUS}" 'Ratoma agent creation' /tmp/ratoma-agent.json
          assert_status 201 "${RATOMA_CITIZEN_STATUS}" 'Ratoma citizen creation' /tmp/ratoma-citizen.json
          assert_status 201 "${MATOTO_AGENT_STATUS}" 'Matoto agent creation' /tmp/matoto-agent.json
          assert_status 201 "${MATOTO_CITIZEN_STATUS}" 'Matoto citizen creation' /tmp/matoto-citizen.json

          # Prove the token used for the attack is the Ratoma ADMIN token.
          RATOMA_TOKEN_SUB="$(RATOMA_TOKEN="${RATOMA_TOKEN}" python - <<'PY'
          import base64, json, os
          payload = os.environ['RATOMA_TOKEN'].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          print(json.loads(base64.urlsafe_b64decode(payload.encode()))['sub'])
          PY
          )"
          RATOMA_CREATED_ID="$(python -c "import json; print(json.load(open('/tmp/ratoma-admin.json'))['id'])")"
          test "${RATOMA_TOKEN_SUB}" = "${RATOMA_CREATED_ID}"

          RATOMA_ACTOR_SCOPE="$(docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
            psql -U eadmin -d eadmin -Atc "SELECT role || '|' || COALESCE(tenant_id,'') || '|' || COALESCE(institution_id,'') FROM users WHERE id='${RATOMA_TOKEN_SUB}';")"
          echo "Ratoma actor DB scope: ${RATOMA_ACTOR_SCOPE}"
          test "${RATOMA_ACTOR_SCOPE}" = 'ADMIN|republique-de-guinee|mairie-ratoma-e2e'

          CROSS_STATUS="$(create_user "${RATOMA_TOKEN}" "agent.cross.e2e@${DOMAIN}" 'Forbidden Cross Commune Agent' AGENT mairie-matoto-e2e /tmp/cross-agent.json)"
          assert_status 403 "${CROSS_STATUS}" 'Ratoma admin creating Matoto agent' /tmp/cross-agent.json

          for account in \
            "${RATOMA_ADMIN}" "${MATOTO_ADMIN}" \
            "${RATOMA_AGENT}" "${MATOTO_AGENT}" \
            "${RATOMA_CITIZEN}" "${MATOTO_CITIZEN}"
          do
            login_token "${account}" "${USER_PASSWORD}" >/dev/null
            echo "Login OK: ${account}"
          done

      - name: Verify durable PostgreSQL assignment
        run: |
          set -euo pipefail
          DOMAIN='ci.eadmin-guinee.org'

          docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
            psql -U eadmin -d eadmin -P pager=off -c \
            "SELECT email, role, tenant_id, institution_id, is_active FROM users WHERE email LIKE '%@${DOMAIN}' ORDER BY institution_id, role, email;"

          check_one() {
            local email="$1"
            local role="$2"
            local institution="$3"
            local count
            count="$(docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
              psql -U eadmin -d eadmin -Atc "SELECT count(*) FROM users WHERE email='${email}' AND role='${role}' AND tenant_id='republique-de-guinee' AND institution_id='${institution}' AND is_active=TRUE;")"
            test "${count}" = '1'
          }

          check_one "admin.ratoma.e2e@${DOMAIN}" ADMIN mairie-ratoma-e2e
          check_one "agent.ratoma.e2e@${DOMAIN}" AGENT mairie-ratoma-e2e
          check_one "citoyen.ratoma.e2e@${DOMAIN}" CITOYEN mairie-ratoma-e2e
          check_one "admin.matoto.e2e@${DOMAIN}" ADMIN mairie-matoto-e2e
          check_one "agent.matoto.e2e@${DOMAIN}" AGENT mairie-matoto-e2e
          check_one "citoyen.matoto.e2e@${DOMAIN}" CITOYEN mairie-matoto-e2e

          RATOMA_ADMINS="$(docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres psql -U eadmin -d eadmin -Atc "SELECT count(*) FROM users WHERE role='ADMIN' AND institution_id='mairie-ratoma-e2e' AND is_active=TRUE;")"
          MATOTO_ADMINS="$(docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres psql -U eadmin -d eadmin -Atc "SELECT count(*) FROM users WHERE role='ADMIN' AND institution_id='mairie-matoto-e2e' AND is_active=TRUE;")"
          test "${RATOMA_ADMINS}" = '1'
          test "${MATOTO_ADMINS}" = '1'

      - name: Verify admin list isolation
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          PASSWORD='CiCommune!2026Aa-test-password'
          DOMAIN='ci.eadmin-guinee.org'

          login_token() {
            curl -fsS -X POST "${API}/auth/login" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "username=$1" \
              --data-urlencode "password=${PASSWORD}" \
              | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])"
          }

          RATOMA_TOKEN="$(login_token "admin.ratoma.e2e@${DOMAIN}")"
          MATOTO_TOKEN="$(login_token "admin.matoto.e2e@${DOMAIN}")"
          curl -fsS -H "Authorization: Bearer ${RATOMA_TOKEN}" "${API}/users?page=1&page_size=100" > /tmp/ratoma-users.json
          curl -fsS -H "Authorization: Bearer ${MATOTO_TOKEN}" "${API}/users?page=1&page_size=100" > /tmp/matoto-users.json

          python - <<'PY'
          import json
          domain = 'ci.eadmin-guinee.org'
          ratoma = json.load(open('/tmp/ratoma-users.json', encoding='utf-8'))['items']
          matoto = json.load(open('/tmp/matoto-users.json', encoding='utf-8'))['items']
          ratoma_emails = {user['email'] for user in ratoma}
          matoto_emails = {user['email'] for user in matoto}

          assert f'agent.ratoma.e2e@{domain}' in ratoma_emails
          assert f'citoyen.ratoma.e2e@{domain}' in ratoma_emails
          assert f'agent.matoto.e2e@{domain}' not in ratoma_emails
          assert f'citoyen.matoto.e2e@{domain}' not in ratoma_emails

          assert f'agent.matoto.e2e@{domain}' in matoto_emails
          assert f'citoyen.matoto.e2e@{domain}' in matoto_emails
          assert f'agent.ratoma.e2e@{domain}' not in matoto_emails
          assert f'citoyen.ratoma.e2e@{domain}' not in matoto_emails

          assert all(user['institution_id'] == 'mairie-ratoma-e2e' for user in ratoma)
          assert all(user['institution_id'] == 'mairie-matoto-e2e' for user in matoto)
          print(f'Ratoma scoped users={len(ratoma)}; Matoto scoped users={len(matoto)}')
          PY

      - name: Debug backend on failure
        if: failure()
        run: docker compose --env-file .env.local.ci -f docker-compose.local.yml logs --tail 300 backend postgres redis

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.local.ci -f docker-compose.local.yml down -v --remove-orphans
