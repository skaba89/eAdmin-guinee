name: Temporary Service Catalog Active Endpoints

on:
  push:
    branches:
      - scratch/service-catalog-active-institutions

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eadmin_catalog_active
          POSTGRES_USER: eadmin
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadmin -d eadmin_catalog_active"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://eadmin:ci-test-password@localhost:5432/eadmin_catalog_active
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_ENDPOINT: localhost:9000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/service-catalog-active-institutions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: ruff check app/services/service_catalog.py tests/test_service_catalog_active_endpoints.py
      - name: Targeted catalog and municipal routing tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_service_catalog_active_endpoints.py \
            tests/test_public_municipality_catalog_scope.py \
            tests/test_service_catalog.py \
            tests/test_municipality_service_request_routing.py
      - name: Full backend suite
        working-directory: backend
        run: pytest tests -q
