name: Citizen Identity Authority Contract

on:
  pull_request:
    paths:
      - 'backend/app/api/service_requests.py'
      - 'backend/tests/test_service_request_hardening.py'
      - 'src/lib/service-requests-api.ts'
      - 'scripts/check-citizen-identity-authority.ts'
      - '.github/workflows/citizen-identity-authority-contract.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/api/service_requests.py'
      - 'backend/tests/test_service_request_hardening.py'
      - 'src/lib/service-requests-api.ts'
      - 'scripts/check-citizen-identity-authority.ts'
      - '.github/workflows/citizen-identity-authority-contract.yml'

permissions:
  contents: read

jobs:
  citizen-identity-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Verify authenticated citizen identity contract
        run: bun scripts/check-citizen-identity-authority.ts
