name: Temporary low-bandwidth preflight

on:
  push:
    branches:
      - work/low-bandwidth-offline-first

permissions:
  contents: write

concurrency:
  group: temporary-low-bandwidth-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/low-bandwidth-offline-first
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize privacy-safe low-bandwidth wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              p = Path(path)
              return p, p.read_text(encoding='utf-8')

          # Backend middleware registration, idempotently.
          p, text = read('backend/app/main.py')
          if 'from app.middleware.idempotency import IdempotencyMiddleware' not in text:
              anchor = 'from app.middleware.audit import AuditMiddleware\n'
              if anchor not in text:
                  raise SystemExit('main audit import anchor missing')
              text = text.replace(anchor, anchor + 'from app.middleware.idempotency import IdempotencyMiddleware\n', 1)
          if 'app.add_middleware(IdempotencyMiddleware)' not in text:
              anchor = 'app.add_middleware(RequestLoggingMiddleware)'
              if anchor not in text:
                  raise SystemExit('main RequestLoggingMiddleware anchor missing')
              text = text.replace(anchor, 'app.add_middleware(IdempotencyMiddleware)\n' + anchor, 1)
          p.write_text(text, encoding='utf-8')

          # Mount PWA bootstrap in the root layout.
          p, text = read('src/app/layout.tsx')
          if "@/components/pwa/pwa-bootstrap" not in text:
              imports = list(re.finditer(r'^import .*$', text, flags=re.MULTILINE))
              if not imports:
                  raise SystemExit('layout import anchor missing')
              at = imports[-1].end()
              text = text[:at] + "\nimport { PwaBootstrap } from '@/components/pwa/pwa-bootstrap'" + text[at:]
          if '<PwaBootstrap />' not in text:
              body = re.search(r'<body(?:\s[^>]*)?>', text)
              if not body:
                  raise SystemExit('layout body anchor missing')
              text = text[:body.end()] + '\n        <PwaBootstrap />' + text[body.end():]
          p.write_text(text, encoding='utf-8')

          # Ensure the manifest is discoverable even if the layout metadata changes.
          p, text = read('src/components/pwa/pwa-bootstrap.tsx')
          if "manifest.rel = 'manifest'" not in text:
              anchor = '    setOnline(navigator.onLine)\n\n'
              if anchor not in text:
                  raise SystemExit('PWA bootstrap online anchor missing')
              text = text.replace(
                  anchor,
                  "    setOnline(navigator.onLine)\n\n"
                  "    if (!document.querySelector('link[rel=\"manifest\"]')) {\n"
                  "      const manifest = document.createElement('link')\n"
                  "      manifest.rel = 'manifest'\n"
                  "      manifest.href = '/manifest.webmanifest'\n"
                  "      document.head.appendChild(manifest)\n"
                  "    }\n\n",
                  1,
              )
          p.write_text(text, encoding='utf-8')

          # Service-request client gets a local fetch wrapper only once.
          p, text = read('src/lib/service-requests-api.ts')
          marker = 'const eadminNativeFetch = globalThis.fetch.bind(globalThis)'
          if marker not in text:
              wrapper = '''import { getStableIdempotencyKey } from '@/lib/idempotency-client'

const eadminNativeFetch = globalThis.fetch.bind(globalThis)

const fetch = async (input: RequestInfo | URL, init?: RequestInit): Promise<Response> => {
  const rawUrl = typeof input === 'string'
    ? input
    : input instanceof URL
      ? input.toString()
      : input.url
  const requestMethod = (
    init?.method
    || (typeof Request !== 'undefined' && input instanceof Request ? input.method : 'GET')
  ).toUpperCase()

  let pathname = ''
  try {
    pathname = new URL(rawUrl, 'http://eadmin.local').pathname
  } catch {
    return eadminNativeFetch(input, init)
  }

  if (
    requestMethod === 'POST'
    && (pathname === '/api/v1/service-requests' || pathname === '/api/v1/service-requests/')
    && typeof init?.body === 'string'
  ) {
    try {
      const payload = JSON.parse(init.body) as unknown
      const idempotencyKey = await getStableIdempotencyKey(payload)
      const headers = new Headers(
        init.headers
        || (typeof Request !== 'undefined' && input instanceof Request ? input.headers : undefined),
      )
      if (!headers.has('Idempotency-Key')) {
        headers.set('Idempotency-Key', idempotencyKey)
      }
      return eadminNativeFetch(input, { ...init, headers })
    } catch {
      // Malformed/non-JSON bodies remain server-authoritative without replay caching.
    }
  }

  return eadminNativeFetch(input, init)
}

'''
              text = wrapper + text
          p.write_text(text, encoding='utf-8')

          # Harden SW: only explicit public assets; public API never sends credentials.
          p, text = read('public/sw.js')
          if 'const PUBLIC_ASSET_PATHS = new Set' not in text:
              anchor = "const PUBLIC_CATALOG_PATHS = new Set([\n  '/api/v1/public/service-catalog',\n])\n"
              if anchor not in text:
                  raise SystemExit('service worker public catalogue anchor missing')
              text = text.replace(
                  anchor,
                  anchor
                  + "const PUBLIC_ASSET_PATHS = new Set([\n"
                  + "  '/logo-128.png',\n"
                  + "  '/logo-256.png',\n"
                  + "  '/guinea-hero-conakry.png',\n"
                  + "])\n",
                  1,
              )
          start = text.index('function isStaticAsset(requestUrl) {')
          end = text.index('\n}\n\nasync function cacheFirst', start) + 2
          text = (
              text[:start]
              + "function isStaticAsset(requestUrl) {\n"
              + "  return requestUrl.pathname.startsWith('/_next/static/')\n"
              + "    || PUBLIC_ASSET_PATHS.has(requestUrl.pathname)\n"
              + "}\n"
              + text[end:]
          )
          if "credentials: 'omit'" not in text:
              text = text.replace(
                  'async function staleWhileRevalidatePublic(request) {\n  const cache = await caches.open(PUBLIC_API_CACHE)\n  const cached = await cache.match(request)\n  const networkPromise = fetch(request)',
                  "async function staleWhileRevalidatePublic(request) {\n"
                  "  const cache = await caches.open(PUBLIC_API_CACHE)\n"
                  "  const publicRequest = new Request(request, { credentials: 'omit' })\n"
                  "  const cached = await cache.match(publicRequest)\n"
                  "  const networkPromise = fetch(publicRequest)",
                  1,
              )
              text = text.replace('await cache.put(request, response.clone())', 'await cache.put(publicRequest, response.clone())', 1)
          p.write_text(text, encoding='utf-8')

          # Extend static policy with mounted layout + no-cookie public requests.
          p, text = read('scripts/ops/check_low_bandwidth_policy.py')
          if '"layout": ROOT / "src/app/layout.tsx"' not in text:
              anchor = '        "bootstrap": ROOT / "src/components/pwa/pwa-bootstrap.tsx",\n'
              if anchor not in text:
                  raise SystemExit('policy bootstrap path anchor missing')
              text = text.replace(anchor, anchor + '        "layout": ROOT / "src/app/layout.tsx",\n', 1)
          if 'Root layout must mount PwaBootstrap' not in text:
              anchor = '    client_idempotency = text["client_idempotency"]\n'
              if anchor not in text:
                  raise SystemExit('policy client anchor missing')
              text = text.replace(
                  anchor,
                  '    layout = text["layout"]\n'
                  '    require("PwaBootstrap" in layout, "Root layout must mount PwaBootstrap", errors)\n'
                  '    require("manifest.webmanifest" in bootstrap, "PWA bootstrap must expose the manifest", errors)\n'
                  '    require("credentials: \'omit\'" in sw, "Public offline API requests must omit credentials", errors)\n'
                  '    require("PUBLIC_ASSET_PATHS" in sw, "Offline static assets must use an explicit allow-list", errors)\n\n'
                  + anchor,
                  1,
              )
          p.write_text(text, encoding='utf-8')

          required = {
              'backend/app/main.py': ['IdempotencyMiddleware'],
              'src/app/layout.tsx': ['PwaBootstrap'],
              'src/lib/service-requests-api.ts': ['getStableIdempotencyKey', 'Idempotency-Key'],
              'public/sw.js': ["credentials: 'omit'", 'PUBLIC_ASSET_PATHS', 'Authorization'],
              'scripts/ops/check_low_bandwidth_policy.py': ['Root layout must mount PwaBootstrap'],
          }
          for path, markers in required.items():
              current = Path(path).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in current:
                      raise SystemExit(f'{path}: missing {marker!r}')

          for helper in Path('.github/workflows').glob('temp-low-bandwidth-*.yml'):
              helper.unlink()
          PY

          python -m compileall -q backend/app backend/tests scripts/ops
          git diff --check

      - name: Commit verified preflight
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preflight already satisfied"
            exit 0
          fi
          git commit -m "fix(network): finalize privacy-safe PWA and idempotency wiring"
          git push origin HEAD:work/low-bandwidth-offline-first
