name: Temporary Nanoid Lock Refresh

on:
  push:
    branches:
      - scratch/nanoid-lock-refresh

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          ref: scratch/nanoid-lock-refresh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Regenerate and validate frozen lock
        run: |
          bun install
          grep -Fq '"nanoid": ["nanoid@3.3.18"' bun.lock
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock && {
            echo 'Expected bun.lock to change for nanoid 3.3.18' >&2
            exit 1
          }

      - name: Commit generated lock on technical branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore(deps): regenerate bun lock for nanoid 3.3.18'
          git push origin HEAD:scratch/nanoid-lock-refresh
