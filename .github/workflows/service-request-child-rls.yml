name: Service Request Child RLS Gate

on:
  pull_request:
    paths:
      - "backend/alembic/versions/**"
      - "backend/app/api/service_request_files.py"
      - "backend/app/api/service_requests.py"
      - "backend/scripts/check_service_request_child_rls.py"
      - "backend/tests/test_service_request_child_authority.py"
      - "backend/tests/test_service_request_hardening.py"
      - "backend/tests/test_municipality_routing_matrix.py"
      - ".github/workflows/service-request-child-rls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  child-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eadmin_request_child_rls
          POSTGRES_USER: eadmin
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadmin -d eadmin_request_child_rls"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://eadmin:ci-test-password@localhost:5432/eadmin_request_child_rls
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_ENDPOINT: localhost:9000

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Require one Alembic head
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t heads < <(alembic heads | awk '{print $1}')
          test "${#heads[@]}" -eq 1
          test "${heads[0]}" = "request_children_parent_rls"

      - name: Upgrade PostgreSQL schema
        run: alembic upgrade head

      - name: Ruff changed security surface
        run: >-
          ruff check
          alembic/versions/service_request_children_parent_rls.py
          app/api/service_request_files.py
          scripts/check_service_request_child_rls.py
          tests/test_service_request_child_authority.py

      - name: Targeted child authority regressions
        run: >-
          pytest -q
          tests/test_service_request_child_authority.py
          tests/test_service_request_hardening.py
          tests/test_municipality_routing_matrix.py

      - name: Full backend regression suite
        run: pytest tests -q

      - name: PostgreSQL NOBYPASSRLS parent-child proof
        run: python scripts/check_service_request_child_rls.py
