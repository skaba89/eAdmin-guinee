name: Temporary Real OCR Wire

on:
  push:
    branches:
      - agent/real-ocr-object-storage

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-ocr-object-storage

      - name: Register real OCR router before legacy documents routes
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')

          old = '    document_imports,\n    document_query,\n    documents,\n'
          new = '    document_imports,\n    document_ocr,\n    document_query,\n    documents,\n'
          if old not in text:
              raise SystemExit('API import anchor not found')
          text = text.replace(old, new, 1)

          old = '''app.include_router(\n    document_query.router,\n    prefix="/api/v1/documents",\n    tags=["Consultation GED"],\n    dependencies=rls_dependencies,\n)'''
          new = '''app.include_router(\n    document_query.router,\n    prefix="/api/v1/documents",\n    tags=["Consultation GED"],\n    dependencies=rls_dependencies,\n)\napp.include_router(\n    document_ocr.router,\n    prefix="/api/v1/documents",\n    tags=["OCR documentaire"],\n    dependencies=rls_dependencies,\n)'''
          if old not in text:
              raise SystemExit('GED query router anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit router wiring
        shell: bash
        run: |
          if git diff --quiet -- backend/app/main.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'security(ocr): prioritize fail-closed persisted OCR routes'
          git push origin HEAD:agent/real-ocr-object-storage
