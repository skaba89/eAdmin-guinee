name: Temporary SOC final wiring

on:
  push:
    branches:
      - work/soc-siem-incident-response

permissions:
  contents: write

concurrency:
  group: temporary-soc-final-wiring
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/soc-siem-incident-response
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure final SOC wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path: str) -> tuple[Path, str]:
              p = Path(path)
              return p, p.read_text(encoding='utf-8')

          def write(p: Path, text: str) -> None:
              p.write_text(text, encoding='utf-8')

          # Config: add settings/validation only if a prior helper did not.
          p, text = load('backend/app/config.py')
          if 'SOC_INGEST_ENABLED: bool = False' not in text:
              anchor = '    OIDC_AUTO_PROVISION: bool = False\n\n'
              if anchor not in text:
                  raise SystemExit('config: OIDC_AUTO_PROVISION anchor missing')
              text = text.replace(
                  anchor,
                  anchor
                  + '    # Machine SOC ingestion is disabled until an authenticated collector is configured.\n'
                  + '    SOC_INGEST_ENABLED: bool = False\n'
                  + '    SOC_INGEST_HMAC_SECRET: str = ""\n'
                  + '    SOC_INGEST_MAX_SKEW_SECONDS: int = 300\n\n',
                  1,
              )
          if 'SOC_INGEST_MAX_SKEW_SECONDS must be between 60 and 900 seconds.' not in text:
              anchor = '        return self\n\n    @property\n    def is_development'
              if anchor not in text:
                  raise SystemExit('config: return-self validator anchor missing')
              validation = (
                  '        if not 60 <= self.SOC_INGEST_MAX_SKEW_SECONDS <= 900:\n'
                  '            raise ValueError("SOC_INGEST_MAX_SKEW_SECONDS must be between 60 and 900 seconds.")\n'
                  '        if self.SOC_INGEST_ENABLED and len(self.SOC_INGEST_HMAC_SECRET) < 32:\n'
                  '            raise ValueError(\n'
                  '                "SOC ingestion is enabled but SOC_INGEST_HMAC_SECRET is shorter than 32 characters."\n'
                  '            )\n\n'
              )
              text = text.replace(anchor, validation + anchor, 1)
          write(p, text)

          # Main router registration.
          p, text = load('backend/app/main.py')
          if '\n    soc,\n' not in text:
              anchor = '    security_hardening,\n'
              if anchor not in text:
                  raise SystemExit('main: security_hardening import anchor missing')
              text = text.replace(anchor, anchor + '    soc,\n', 1)
          if 'soc.ingest_router' not in text:
              anchor = (
                  'app.include_router(\n'
                  '    identity_federation.public_router,\n'
                  '    prefix="/api/v1/auth/sso",\n'
                  '    tags=["SSO OIDC"],\n'
                  ')\n'
              )
              if anchor not in text:
                  raise SystemExit('main: identity federation public router anchor missing')
              addition = (
                  anchor
                  + 'app.include_router(\n'
                  + '    soc.ingest_router,\n'
                  + '    prefix="/api/v1/soc",\n'
                  + '    tags=["SOC - ingestion machine"],\n'
                  + ')\n'
              )
              text = text.replace(anchor, addition, 1)
          if 'soc.router' not in text:
              anchor = 'app.include_router(metrics.router, tags=["Métriques"])'
              if anchor not in text:
                  raise SystemExit('main: metrics router anchor missing')
              addition = (
                  'app.include_router(\n'
                  '    soc.router,\n'
                  '    prefix="/api/v1/soc",\n'
                  '    tags=["SOC et réponse à incident"],\n'
                  '    dependencies=rls_dependencies,\n'
                  ')\n'
                  + anchor
              )
              text = text.replace(anchor, addition, 1)
          write(p, text)

          # Audit mirror: SQLite-only direct insert for isolated unit tests.
          p, text = load('backend/app/services/soc_service.py')
          if 'if connection.dialect.name != "postgresql":' not in text:
              anchor = '    original = connection.execute(\n'
              if anchor not in text:
                  raise SystemExit('soc_service: original RLS context anchor missing')
              values = '''SecuritySignal.__table__.insert().values(
                  id=uuid.uuid4(),
                  source="application_audit",
                  external_event_id=f"audit:{target_id}",
                  event_type=event_type[:150],
                  category=(category or "audit")[:100],
                  severity=severity,
                  tenant_id=tenant_id[:100],
                  institution_id=str(institution_id)[:100] if institution_id else None,
                  actor_id=actor_id,
                  resource_type=str(resource_type)[:100] if resource_type else None,
                  resource_id=str(resource_id)[:255] if resource_id else None,
                  correlation_key=correlation_key,
                  network_source_hash=network_hash,
                  user_agent_hash=agent_hash,
                  details=normalized_details,
                  occurred_at=occurred_at,
              )'''
              addition = (
                  '    if connection.dialect.name != "postgresql":\n'
                  '        connection.execute(\n'
                  f'            {values}\n'
                  '        )\n'
                  '        return\n\n'
                  + anchor
              )
              text = text.replace(anchor, addition, 1)
          write(p, text)

          # Test readability cleanup if still needed.
          p, text = load('backend/tests/test_soc_service.py')
          text = text.replace(
              'severity="warning" if False else "high",',
              'severity="high",',
          )
          write(p, text)

          # Assert the final branch contains every mandatory wiring marker.
          required = {
              'backend/app/config.py': [
                  'SOC_INGEST_ENABLED: bool = False',
                  'SOC_INGEST_HMAC_SECRET',
                  'SOC_INGEST_MAX_SKEW_SECONDS must be between 60 and 900 seconds.',
              ],
              'backend/app/main.py': ['soc.ingest_router', 'soc.router'],
              'backend/app/services/soc_service.py': [
                  'if connection.dialect.name != "postgresql":',
                  'SOC_SERVICE',
              ],
          }
          for path, markers in required.items():
              current = Path(path).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in current:
                      raise SystemExit(f'{path}: missing final marker {marker!r}')

          # No temporary workflow survives the final wiring commit.
          for helper in (
              '.github/workflows/temp-soc-wire.yml',
              '.github/workflows/temp-soc-finalize-wiring.yml',
          ):
              hp = Path(helper)
              if hp.exists():
                  hp.unlink()
          PY

          git diff --check
          git status --short

      - name: Commit verified wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiring changes required"
            exit 0
          fi
          git commit -m "wire(soc): finalize verified incident-response integration"
          git push origin HEAD:work/soc-siem-incident-response
