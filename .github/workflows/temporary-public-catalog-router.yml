name: Temporary Public Catalog Router

on:
  push:
    branches:
      - agent/public-service-catalog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-service-catalog

      - name: Register public catalog router
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          marker = 'rls_dependencies = [Depends(set_rls_context)]\n\n'
          insertion = '''rls_dependencies = [Depends(set_rls_context)]\n\n# Public administrative-service metadata is readable without authentication.\n# The route installs its own host-derived PUBLIC RLS context and does not accept\n# client tenant/institution headers in non-development environments.\napp.include_router(\n    service_catalog.public_router,\n    prefix="/api/v1/public/service-catalog",\n    tags=["Catalogue public des démarches"],\n)\n\n'''
          if 'prefix="/api/v1/public/service-catalog"' not in text:
              if marker not in text:
                  raise SystemExit('RLS dependency marker missing')
              text = text.replace(marker, insertion, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit router
        shell: bash
        run: |
          if git diff --quiet -- backend/app/main.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'feat(catalog): register unauthenticated public catalog route'
          git push origin HEAD:agent/public-service-catalog
