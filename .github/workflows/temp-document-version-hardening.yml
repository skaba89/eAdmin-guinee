name: Temporary Document Version RLS Hardening

on:
  push:
    branches:
      - scratch/document-version-rls-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eadmin_docversion
          POSTGRES_USER: eadmin
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eadmin -d eadmin_docversion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://eadmin:ci-test-password@localhost:5432/eadmin_docversion
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_ENDPOINT: localhost:9000
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v4
        with:
          ref: scratch/document-version-rls-hardening
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify single Alembic head before patch
        working-directory: backend
        run: |
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" = 1
          printf '%s\n' "$heads" | grep -q '^municipal_route_history_lock (head)$'

      - name: Apply deterministic scratch patch
        run: python .scratch/document_version_hardening_patch.py

      - name: Normalize PostgreSQL probe
        run: python .scratch/fix_document_probe.py

      - name: Verify migration chain after patch
        working-directory: backend
        run: |
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" = 1
          printf '%s\n' "$heads" | grep -q '^document_versions_parent_rls (head)$'
          alembic upgrade head

      - name: Lint hardening surface
        working-directory: backend
        run: |
          ruff check \
            app/services/document_version_service.py \
            scripts/check_document_version_rls.py \
            tests/test_document_version_scope.py \
            alembic/versions/document_versions_parent_rls.py

      - name: Run document version regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_document_version_scope.py \
            tests/test_document_file_authority.py \
            tests/test_ged_server_backed_workspace.py \
            tests/test_real_ocr_hardening.py \
            tests/test_parapheur_evidence.py

      - name: Run PostgreSQL NOBYPASSRLS proof
        working-directory: backend
        run: python scripts/check_document_version_rls.py

      - name: Validate permanent workflow syntax
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/document-version-rls.yml', encoding='utf-8'))"

      - name: Run complete backend suite
        working-directory: backend
        run: pytest tests -q

      - name: Remove scratch artifacts and verify diff
        run: |
          rm .github/workflows/temp-document-version-hardening.yml
          rm .scratch/document_version_hardening_patch.py
          rm .scratch/fix_document_probe.py
          rmdir .scratch 2>/dev/null || true
          git diff --check
          git status --short

      - name: Commit validated scratch tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ged): isolate document version history by parent RLS"
          git push origin HEAD:scratch/document-version-rls-hardening
