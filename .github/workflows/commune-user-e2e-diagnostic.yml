name: Commune User E2E Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commune-users-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env.local.ci <<'EOF'
          POSTGRES_PASSWORD=ci_postgres_password_2026
          REDIS_PASSWORD=ci_redis_password_2026
          MINIO_ROOT_USER=eadmin
          MINIO_ROOT_PASSWORD=ci_minio_password_2026
          SECRET_KEY=ci_secret_key_0123456789abcdef0123456789abcdef0123456789abcdef
          ENCRYPTION_KEY=ci_encryption_key_0123456789abcdef0123456789abcdef
          NEXT_PUBLIC_ENCRYPTION_KEY=ci_frontend_encryption_0123456789abcdef
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=Grafana!2026Aa-ci-password
          LOCAL_TEST_PASSWORD=CiLocal!2026Aa-test-password
          LOCAL_TEST_DOMAIN=eadmin.test
          LOCAL_SUPERADMIN_EMAIL=superadmin@eadmin.test
          LOCAL_FRONTEND_PORT=3000
          LOCAL_BACKEND_PORT=8000
          LOCAL_POSTGRES_PORT=5433
          LOCAL_REDIS_PORT=6380
          LOCAL_MINIO_CONSOLE_PORT=9101
          LOCAL_MAILPIT_SMTP_PORT=1025
          LOCAL_MAILPIT_UI_PORT=8025
          EOF

      - name: Build and start backend
        run: |
          set -euo pipefail
          docker compose --env-file .env.local.ci -f docker-compose.local.yml build backend
          docker compose --env-file .env.local.ci -f docker-compose.local.yml up -d postgres redis minio minio-init mailpit
          docker compose --env-file .env.local.ci -f docker-compose.local.yml run --rm --no-deps backend alembic upgrade head
          docker compose --env-file .env.local.ci -f docker-compose.local.yml run --rm --no-deps backend python -m app.bootstrap_runtime
          docker compose --env-file .env.local.ci -f docker-compose.local.yml up -d backend
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo 'Backend healthy'
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.local.ci -f docker-compose.local.yml logs --tail 200 backend
          exit 1

      - name: Seed Ratoma and Matoto
        run: |
          docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres \
            psql -U eadmin -d eadmin -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO institutions (id, tenant_id, name, type, is_active, settings)
          VALUES
            ('mairie-ratoma-e2e', 'republique-de-guinee', 'Mairie de Ratoma E2E', 'mairie', TRUE, '{"e2e": true}'::json),
            ('mairie-matoto-e2e', 'republique-de-guinee', 'Mairie de Matoto E2E', 'mairie', TRUE, '{"e2e": true}'::json)
          ON CONFLICT (id) DO UPDATE SET
            tenant_id=EXCLUDED.tenant_id, name=EXCLUDED.name, type=EXCLUDED.type, is_active=TRUE;
          SQL

      - name: Login SUPER_ADMIN and preserve validation 422
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          curl -fsS -X POST "${API}/auth/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=superadmin@eadmin.test' \
            --data-urlencode 'password=CiLocal!2026Aa-test-password' \
            | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])" > /tmp/eadmin-super-token
          chmod 600 /tmp/eadmin-super-token
          test -s /tmp/eadmin-super-token
          status="$(curl -sS -o /tmp/invalid-user.json -w '%{http_code}' -X POST "${API}/users" \
            -H "Authorization: Bearer $(cat /tmp/eadmin-super-token)" \
            -H 'Content-Type: application/json' \
            -d '{"email":"not-an-email","password":"CiCommune!2026Aa-test-password","full_name":"Invalid","role":"ADMIN","tenant_id":"republique-de-guinee","institution_id":"mairie-ratoma-e2e"}')"
          echo "Invalid payload: HTTP ${status}"
          test "${status}" = '422' || { cat /tmp/invalid-user.json; exit 1; }

      - name: Create one ADMIN for Ratoma and Matoto
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          TOKEN="$(cat /tmp/eadmin-super-token)"
          PASSWORD='CiCommune!2026Aa-test-password'
          create_admin() {
            local email="$1" institution="$2" body="$3"
            curl -sS -o "${body}" -w '%{http_code}' -X POST "${API}/users" \
              -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
              -d "{\"email\":\"${email}\",\"password\":\"${PASSWORD}\",\"full_name\":\"Admin E2E\",\"role\":\"ADMIN\",\"tenant_id\":\"republique-de-guinee\",\"institution_id\":\"${institution}\"}"
          }
          r="$(create_admin admin.ratoma.e2e@ci.eadmin-guinee.org mairie-ratoma-e2e /tmp/ratoma-admin.json)"
          m="$(create_admin admin.matoto.e2e@ci.eadmin-guinee.org mairie-matoto-e2e /tmp/matoto-admin.json)"
          echo "Ratoma ADMIN: HTTP ${r}"
          echo "Matoto ADMIN: HTTP ${m}"
          test "${r}" = '201' || { cat /tmp/ratoma-admin.json; exit 1; }
          test "${m}" = '201' || { cat /tmp/matoto-admin.json; exit 1; }

      - name: Reject second Ratoma ADMIN with 409
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          status="$(curl -sS -o /tmp/duplicate-admin.json -w '%{http_code}' -X POST "${API}/users" \
            -H "Authorization: Bearer $(cat /tmp/eadmin-super-token)" -H 'Content-Type: application/json' \
            -d '{"email":"admin.ratoma.duplicate.e2e@ci.eadmin-guinee.org","password":"CiCommune!2026Aa-test-password","full_name":"Duplicate Ratoma Admin","role":"ADMIN","tenant_id":"republique-de-guinee","institution_id":"mairie-ratoma-e2e"}')"
          echo "Second Ratoma ADMIN: HTTP ${status}"
          test "${status}" = '409' || { cat /tmp/duplicate-admin.json; exit 1; }

      - name: Authenticate Ratoma and Matoto ADMINs
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          login_to_file() {
            local email="$1" file="$2"
            curl -fsS -X POST "${API}/auth/login" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "username=${email}" \
              --data-urlencode 'password=CiCommune!2026Aa-test-password' \
              | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])" > "${file}"
            chmod 600 "${file}"
            test -s "${file}"
          }
          login_to_file admin.ratoma.e2e@ci.eadmin-guinee.org /tmp/eadmin-ratoma-token
          echo 'Ratoma ADMIN login: HTTP 200'
          login_to_file admin.matoto.e2e@ci.eadmin-guinee.org /tmp/eadmin-matoto-token
          echo 'Matoto ADMIN login: HTTP 200'

      - name: Ratoma ADMIN creates Ratoma AGENT and CITOYEN
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          TOKEN="$(cat /tmp/eadmin-ratoma-token)"
          create_user() {
            local email="$1" role="$2" body="$3"
            curl -sS -o "${body}" -w '%{http_code}' -X POST "${API}/users" \
              -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
              -d "{\"email\":\"${email}\",\"password\":\"CiCommune!2026Aa-test-password\",\"full_name\":\"${role} Ratoma E2E\",\"role\":\"${role}\",\"tenant_id\":\"republique-de-guinee\",\"institution_id\":\"mairie-ratoma-e2e\"}"
          }
          a="$(create_user agent.ratoma.e2e@ci.eadmin-guinee.org AGENT /tmp/ratoma-agent.json)"
          c="$(create_user citoyen.ratoma.e2e@ci.eadmin-guinee.org CITOYEN /tmp/ratoma-citizen.json)"
          echo "Ratoma AGENT: HTTP ${a}"
          echo "Ratoma CITOYEN: HTTP ${c}"
          test "${a}" = '201' || { cat /tmp/ratoma-agent.json; exit 1; }
          test "${c}" = '201' || { cat /tmp/ratoma-citizen.json; exit 1; }

      - name: Matoto ADMIN creates Matoto AGENT and CITOYEN
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          TOKEN="$(cat /tmp/eadmin-matoto-token)"
          create_user() {
            local email="$1" role="$2" body="$3"
            curl -sS -o "${body}" -w '%{http_code}' -X POST "${API}/users" \
              -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
              -d "{\"email\":\"${email}\",\"password\":\"CiCommune!2026Aa-test-password\",\"full_name\":\"${role} Matoto E2E\",\"role\":\"${role}\",\"tenant_id\":\"republique-de-guinee\",\"institution_id\":\"mairie-matoto-e2e\"}"
          }
          a="$(create_user agent.matoto.e2e@ci.eadmin-guinee.org AGENT /tmp/matoto-agent.json)"
          c="$(create_user citoyen.matoto.e2e@ci.eadmin-guinee.org CITOYEN /tmp/matoto-citizen.json)"
          echo "Matoto AGENT: HTTP ${a}"
          echo "Matoto CITOYEN: HTTP ${c}"
          test "${a}" = '201' || { cat /tmp/matoto-agent.json; exit 1; }
          test "${c}" = '201' || { cat /tmp/matoto-citizen.json; exit 1; }

      - name: Reject Ratoma ADMIN creating Matoto AGENT with 403
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          status="$(curl -sS -o /tmp/cross-agent.json -w '%{http_code}' -X POST "${API}/users" \
            -H "Authorization: Bearer $(cat /tmp/eadmin-ratoma-token)" -H 'Content-Type: application/json' \
            -d '{"email":"agent.cross.e2e@ci.eadmin-guinee.org","password":"CiCommune!2026Aa-test-password","full_name":"Forbidden Cross Commune Agent","role":"AGENT","tenant_id":"republique-de-guinee","institution_id":"mairie-matoto-e2e"}')"
          echo "Ratoma -> Matoto AGENT: HTTP ${status}"
          test "${status}" = '403' || { cat /tmp/cross-agent.json; exit 1; }

      - name: Verify six durable commune assignments in PostgreSQL
        run: |
          set -euo pipefail
          docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres psql -U eadmin -d eadmin -Atc \
            "SELECT email || '|' || role || '|' || institution_id FROM users WHERE email LIKE '%@ci.eadmin-guinee.org' AND email NOT LIKE 'agent.cross.%' ORDER BY email;"
          count="$(docker compose --env-file .env.local.ci -f docker-compose.local.yml exec -T postgres psql -U eadmin -d eadmin -Atc \
            "SELECT count(*) FROM users WHERE email IN ('admin.ratoma.e2e@ci.eadmin-guinee.org','admin.matoto.e2e@ci.eadmin-guinee.org','agent.ratoma.e2e@ci.eadmin-guinee.org','agent.matoto.e2e@ci.eadmin-guinee.org','citoyen.ratoma.e2e@ci.eadmin-guinee.org','citoyen.matoto.e2e@ci.eadmin-guinee.org') AND is_active=TRUE;")"
          echo "Durable expected commune users: ${count}/6"
          test "${count}" = '6'

      - name: Authenticate created AGENT and CITOYEN accounts
        run: |
          set -euo pipefail
          API='http://localhost:8000/api/v1'
          for account in \
            agent.ratoma.e2e@ci.eadmin-guinee.org \
            citoyen.ratoma.e2e@ci.eadmin-guinee.org \
            agent.matoto.e2e@ci.eadmin-guinee.org \
            citoyen.matoto.e2e@ci.eadmin-guinee.org
          do
            status="$(curl -sS -o /tmp/login-check.json -w '%{http_code}' -X POST "${API}/auth/login" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "username=${account}" \
              --data-urlencode 'password=CiCommune!2026Aa-test-password')"
            echo "Login ${account}: HTTP ${status}"
            test "${status}" = '200' || { cat /tmp/login-check.json; exit 1; }
            sleep 1
          done

      - name: Backend logs on failure
        if: failure()
        run: docker compose --env-file .env.local.ci -f docker-compose.local.yml logs --tail 200 backend

      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.local.ci -f docker-compose.local.yml down -v --remove-orphans
