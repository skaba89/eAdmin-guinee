name: Legacy RBAC Permission Contract

on:
  pull_request:
    paths:
      - 'src/lib/rbac.ts'
      - 'src/lib/legacy-rbac-role-map.ts'
      - 'src/lib/service-request-rbac.ts'
      - 'src/lib/frontend-role-authority.ts'
      - 'scripts/check-legacy-rbac-permission-contract.ts'
      - '.github/workflows/legacy-rbac-permission-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/rbac.ts'
      - 'src/lib/legacy-rbac-role-map.ts'
      - 'src/lib/service-request-rbac.ts'
      - 'src/lib/frontend-role-authority.ts'
      - 'scripts/check-legacy-rbac-permission-contract.ts'
      - '.github/workflows/legacy-rbac-permission-contract.yml'

permissions:
  contents: read

jobs:
  legacy-permission-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Verify explicit non-lateral legacy permissions
        run: bun scripts/check-legacy-rbac-permission-contract.ts
