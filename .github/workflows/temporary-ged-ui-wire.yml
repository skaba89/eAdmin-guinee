name: Temporary GED UI Wire

on:
  push:
    branches:
      - agent/ged-server-backed-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ged-server-backed-ui

      - name: Register GED import and query routers before legacy routes
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')

          old = '    courriers,\n    document_files,\n    documents,\n    documents_search,\n'
          new = '    courriers,\n    document_files,\n    document_imports,\n    document_query,\n    documents,\n    documents_search,\n'
          if old not in text:
              raise SystemExit('API import anchor not found')
          text = text.replace(old, new, 1)

          old = '''# Register server-authoritative GED file mutations before the historical\n# documents router so clients cannot fall through to path/hash based mutations.\napp.include_router(\n    document_files.router,\n    prefix="/api/v1/documents",\n    tags=["Fichiers GED sécurisés"],\n    dependencies=rls_dependencies,\n)'''
          new = '''# Register all server-authoritative GED routes before the historical\n# documents router. Import/query/file routes therefore own duplicate method/path\n# combinations and prevent client-authoritative legacy mutations.\napp.include_router(\n    document_imports.router,\n    prefix="/api/v1/documents",\n    tags=["Import GED sécurisé"],\n    dependencies=rls_dependencies,\n)\napp.include_router(\n    document_query.router,\n    prefix="/api/v1/documents",\n    tags=["Consultation GED"],\n    dependencies=rls_dependencies,\n)\napp.include_router(\n    document_files.router,\n    prefix="/api/v1/documents",\n    tags=["Fichiers GED sécurisés"],\n    dependencies=rls_dependencies,\n)'''
          if old not in text:
              raise SystemExit('GED router anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit router wiring
        shell: bash
        run: |
          if git diff --quiet -- backend/app/main.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'security(ged): prioritize authoritative import and query routes'
          git push origin HEAD:agent/ged-server-backed-ui
