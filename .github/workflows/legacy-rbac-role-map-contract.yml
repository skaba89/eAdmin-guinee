name: Legacy RBAC Role Map Contract

on:
  pull_request:
    paths:
      - 'src/lib/rbac.ts'
      - 'src/lib/legacy-rbac-role-map.ts'
      - 'src/lib/frontend-role-authority.ts'
      - 'src/data/demo-accounts.ts'
      - 'scripts/check-legacy-rbac-role-map-contract.ts'
      - '.github/workflows/legacy-rbac-role-map-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/rbac.ts'
      - 'src/lib/legacy-rbac-role-map.ts'
      - 'src/lib/frontend-role-authority.ts'
      - 'src/data/demo-accounts.ts'
      - 'scripts/check-legacy-rbac-role-map-contract.ts'
      - '.github/workflows/legacy-rbac-role-map-contract.yml'

permissions:
  contents: read

jobs:
  legacy-role-map-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Verify fail-closed legacy role mapping
        run: bun scripts/check-legacy-rbac-role-map-contract.ts
