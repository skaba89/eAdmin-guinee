name: Temporary Test Contract Alignment

on:
  push:
    branches:
      - agent/p0-ci-remediation-2

permissions:
  contents: write

jobs:
  align-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-ci-remediation-2

      - name: Align security tests with hardened contracts
        shell: python
        run: |
          from pathlib import Path

          auth = Path('backend/tests/test_auth_comprehensive.py')
          text = auth.read_text(encoding='utf-8')

          replacements = [
              ('assert data["role"] == "AGENT"\n        assert "id" in data\n        assert data["is_active"] is True\n        assert "frontend_role" in data\n        assert data["frontend_role"] == "agence"',
               'assert data["role"] == "CITOYEN"\n        assert "id" in data\n        assert data["is_active"] is True\n        assert data["mfa_enabled"] is False\n        assert "frontend_role" in data\n        assert data["frontend_role"] == "citoyen"'),
              ('"password": "Test2026!",\n                "full_name": "Duplicate User",',
               '"password": "Duplicate2026!",\n                "full_name": "Duplicate User",'),
              ('async def test_register_default_role_is_agent', 'async def test_register_default_role_is_citizen'),
              ('"""TC-REG-005: Le rôle par défaut est AGENT si non spécifié."""', '"""TC-REG-005: Le rôle public par défaut est CITOYEN."""'),
              ('assert data["role"] == "AGENT"\n\n    @pytest.mark.asyncio\n    async def test_register_invalid_email',
               'assert data["role"] == "CITOYEN"\n        assert data["frontend_role"] == "citoyen"\n\n    @pytest.mark.asyncio\n    async def test_register_invalid_email'),
              ('assert payload["frontend_role"] == "agence"', 'assert payload["frontend_role"] == "agent"'),
              ('assert data["frontend_role"] == "agence"', 'assert data["frontend_role"] == "agent"'),
              ('"new_password": "NewPassword2026!"', '"new_password": "NouvelleCle2026!"'),
              ('assert response.status_code == 400\n        assert "incorrect" in response.json()["detail"].lower()',
               'assert response.status_code == 401\n        assert "incorrect" in response.json()["detail"].lower()'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Pattern missing in auth tests: {old[:90]!r}')
              text = text.replace(old, new, 1)
          auth.write_text(text, encoding='utf-8')

          security = Path('backend/tests/test_security.py')
          text = security.read_text(encoding='utf-8')
          text = text.replace('"Origin": "http://localhost:3000"', '"Origin": "https://eadmin.gouv.gn"', 1)
          text = text.replace('== "http://localhost:3000"', '== "https://eadmin.gouv.gn"', 1)
          if 'Min1ma_l' not in text:
              raise SystemExit('Minimal password test pattern missing')
          text = text.replace('Min1ma_l', 'Min1male_2026!', 1)
          security.write_text(text, encoding='utf-8')

      - name: Commit aligned tests
        shell: bash
        run: |
          if git diff --quiet -- backend/tests; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/test_auth_comprehensive.py backend/tests/test_security.py
          git commit -m 'test(security): align assertions with hardened contracts'
          git push origin HEAD:agent/p0-ci-remediation-2
