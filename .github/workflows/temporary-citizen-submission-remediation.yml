name: Temporary Citizen Submission Remediation

on:
  push:
    branches:
      - agent/citizen-submission-authoritative

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/citizen-submission-authoritative

      - name: Make citizen submission server-authoritative
        shell: python
        run: |
          from pathlib import Path

          store_path = Path('src/store/citizen-requests-store.ts')
          text = store_path.read_text(encoding='utf-8')

          text = text.replace(
              "  addRequest: (req: NewRequestInput) => CitizenRequest\n",
              "  addRequest: (req: NewRequestInput) => Promise<RequestSubmissionResult>\n",
              1,
          )

          marker = "interface CitizenRequestsState {\n"
          result_type = """export interface RequestSubmissionResult {\n  request: CitizenRequest\n  attachmentErrors: string[]\n}\n\n"""
          if result_type not in text:
              if marker not in text:
                  raise SystemExit('CitizenRequestsState marker missing')
              text = text.replace(marker, result_type + marker, 1)

          start = text.index('  addRequest: (req) => {\n')
          end = text.index('\n  updateRequestStatus:', start)
          replacement = '''  addRequest: async (req) => {\n    set({ syncError: null })\n\n    let mairie = req.mairie\n    if ((req.categoryId === 'etat-civil' || req.categoryId === 'residence') && !mairie) {\n      const match = req.citizenAddress.match(/Commune de\\s+([^,]+)/i)\n      if (match) mairie = `Mairie de ${match[1].trim()}`\n    }\n\n    // Resolve routing before creating anything. If routing is ambiguous, the\n    // caller can safely retry because no server-side request exists yet.\n    const targetInstitutionId = await resolveTargetInstitution({\n      categoryId: req.categoryId,\n      mairie,\n      citizenAddress: req.citizenAddress,\n      targetInstitutionId: req.targetInstitutionId,\n    })\n\n    const created = await serviceRequestsApi.createRequest({\n      serviceId: req.serviceId,\n      serviceName: req.serviceName,\n      category: req.category,\n      categoryId: req.categoryId,\n      targetInstitutionId,\n      citizenName: req.citizenName,\n      citizenFirstName: req.citizenFirstName,\n      citizenNIN: req.citizenNIN,\n      citizenPhone: req.citizenPhone,\n      citizenEmail: req.citizenEmail,\n      citizenAddress: req.citizenAddress,\n      motif: req.motif,\n      documents: req.documents,\n      mairie,\n      deliveryMode: req.deliveryMode,\n    })\n\n    // From this point on the request exists officially. Never remove it from\n    // memory or report a generic submission failure if a later attachment fails;\n    // doing so would encourage duplicate citizen requests on retry.\n    set((state) => ({\n      requests: [created, ...state.requests.filter((item) => item.id !== created.id)],\n      syncError: null,\n    }))\n\n    const attachmentErrors: string[] = []\n    for (const document of req.uploadedDocuments || []) {\n      if (document.serverStored) continue\n      try {\n        const file = await dataUrlToFile(document)\n        await serviceRequestsApi.uploadAttachment(created.id, file, document.requiredDocName)\n      } catch (error) {\n        const reason = error instanceof Error ? error.message : 'échec de transmission'\n        attachmentErrors.push(`${document.name}: ${reason}`)\n      }\n    }\n\n    await get().hydrateRequests()\n    const refreshed = get().requests.find((item) => item.id === created.id) || created\n\n    if (attachmentErrors.length) {\n      set({\n        syncError: `La demande ${created.reference} est enregistrée, mais ${attachmentErrors.length} pièce(s) n’ont pas été transmise(s).`,\n      })\n    }\n\n    return { request: refreshed, attachmentErrors }\n  },\n'''
          text = text[:start] + replacement + text[end:]
          store_path.write_text(text, encoding='utf-8')

          page_path = Path('src/components/app/citizen-portal-page.tsx')
          text = page_path.read_text(encoding='utf-8')

          old_state = "  const [successToast, setSuccessToast] = useState('')\n\n  // Request dialog\n  const [requestDialogOpen, setRequestDialogOpen] = useState(false)\n"
          new_state = "  const [successToast, setSuccessToast] = useState('')\n  const [submissionError, setSubmissionError] = useState('')\n  const [isSubmittingRequest, setIsSubmittingRequest] = useState(false)\n\n  // Request dialog\n  const [requestDialogOpen, setRequestDialogOpen] = useState(false)\n"
          if old_state not in text:
              raise SystemExit('Submission state marker missing')
          text = text.replace(old_state, new_state, 1)

          start = text.index('  const handleSubmitRequest = () => {\n')
          end = text.index('\n  const handleTrack = () => {', start)
          replacement = '''  const handleSubmitRequest = async () => {\n    if (!validateForm() || !selectedService || !selectedCategoryInfo || isSubmittingRequest) return\n\n    setSubmissionError('')\n    setIsSubmittingRequest(true)\n\n    try {\n      const { request: newRequest, attachmentErrors } = await addRequest({\n        serviceId: selectedService.id,\n        serviceName: selectedService.name,\n        category: selectedCategoryInfo.name,\n        categoryId: selectedCategoryInfo.id,\n        citizenName: form.citizenName,\n        citizenFirstName: form.citizenFirstName,\n        citizenNIN: form.citizenNIN,\n        citizenPhone: form.citizenPhone,\n        citizenEmail: form.citizenEmail,\n        citizenAddress: form.citizenAddress,\n        motif: form.motif || `Demande de ${selectedService.name}`,\n        documents: selectedService.requiredDocs,\n        uploadedDocuments: Array.from(uploadedFiles.values()),\n        createdAt: new Date().toISOString(),\n        deliveryMode: form.deliveryMode,\n      })\n\n      setRequestDialogOpen(false)\n      setUploadedFiles(new Map())\n      setUploadErrors({})\n      setSubmissionError('')\n      setActiveTab('mes-demandes')\n\n      if (attachmentErrors.length) {\n        setSuccessToast(\n          `Demande enregistrée sous la référence ${newRequest.reference}. ${attachmentErrors.length} pièce(s) restent à transmettre.`,\n        )\n      } else {\n        setSuccessToast(`Demande soumise avec succès ! Référence officielle : ${newRequest.reference}`)\n      }\n    } catch (error) {\n      setSubmissionError(\n        error instanceof Error\n          ? error.message\n          : 'La demande n’a pas pu être enregistrée. Vérifiez votre connexion puis réessayez.',\n      )\n    } finally {\n      setIsSubmittingRequest(false)\n    }\n  }\n'''
          text = text[:start] + replacement + text[end:]

          old_footer = '''          <DialogFooter className="gap-2">\n            <Button variant="outline" onClick={() => setRequestDialogOpen(false)} className="focus-ring-premium">Annuler</Button>\n            <Button className="btn-guinea gap-2" onClick={handleSubmitRequest}>\n              <Send className="size-4" />\n              Soumettre la demande\n            </Button>\n          </DialogFooter>'''
          new_footer = '''          {submissionError && (\n            <div className="flex items-start gap-2 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-300" role="alert">\n              <AlertCircle className="mt-0.5 size-4 shrink-0" />\n              <span>{submissionError}</span>\n            </div>\n          )}\n\n          <DialogFooter className="gap-2">\n            <Button\n              variant="outline"\n              onClick={() => {\n                setSubmissionError('')\n                setRequestDialogOpen(false)\n              }}\n              className="focus-ring-premium"\n              disabled={isSubmittingRequest}\n            >\n              Annuler\n            </Button>\n            <Button\n              className="btn-guinea gap-2"\n              onClick={() => void handleSubmitRequest()}\n              disabled={isSubmittingRequest}\n              aria-busy={isSubmittingRequest}\n            >\n              <Send className={`size-4 ${isSubmittingRequest ? 'animate-pulse' : ''}`} />\n              {isSubmittingRequest ? 'Enregistrement sécurisé…' : 'Soumettre la demande'}\n            </Button>\n          </DialogFooter>'''
          if old_footer not in text:
              raise SystemExit('Submission footer pattern missing')
          text = text.replace(old_footer, new_footer, 1)
          page_path.write_text(text, encoding='utf-8')

      - name: Commit remediation
        shell: bash
        run: |
          if git diff --quiet -- src/store/citizen-requests-store.ts src/components/app/citizen-portal-page.tsx; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/store/citizen-requests-store.ts src/components/app/citizen-portal-page.tsx
          git commit -m 'fix(citizen): wait for official server reference before success'
          git push origin HEAD:agent/citizen-submission-authoritative
